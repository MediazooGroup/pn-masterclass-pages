<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Procrastination Nation</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--paper:#E8E6FF;--ink:#251F20;--pink:#FF4DFF;--violet:#5639FF;--mute:rgba(37,31,32,.62);--line:rgba(37,31,32,.2)}
*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.4 Aptos,Arial,Helvetica,sans-serif;min-height:100vh}
main{max-width:680px;margin:0 auto;padding:28px 18px 60px}
@media (min-width:700px){body{font-size:21px}main{padding:56px 24px 80px}}
.thing{background:var(--violet);color:#fff;border-radius:14px;padding:14px 18px;margin:0 0 26px;font-size:18px;line-height:1.35}
.thing small{display:block;font:15px/1 'Bebas Neue',Arial,sans-serif;letter-spacing:.1em;color:var(--pink);margin-bottom:6px}
.lens{font:22px/1 'Bebas Neue',Arial,sans-serif;letter-spacing:.1em;color:var(--violet);margin:0 0 10px}
.ask{color:var(--mute);margin:0 0 22px;font-size:17px}
h1{font:46px/1.02 'Bebas Neue',Arial,sans-serif;letter-spacing:.01em;margin:0 0 10px;color:var(--ink)}
@media (min-width:700px){h1{font-size:62px}}
.help{color:var(--mute);margin:0 0 18px;font-size:17px}
.opts button{display:block;width:100%;text-align:left;font:inherit;padding:14px 18px;margin:10px 0;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
.opts button.on{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:700}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin-top:8px}
.scale button{font:inherit;padding:13px 0;border:2px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer}
.scale button.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.ends{display:flex;justify-content:space-between;font-size:16px;color:var(--mute);margin-top:8px}
textarea,input[type=email]{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-top:6px}
textarea{min-height:110px;resize:vertical}textarea:focus,input:focus{outline:none;border-color:var(--violet)}
.next{display:block;width:100%;font:28px/1 'Bebas Neue',Arial,sans-serif;letter-spacing:.08em;padding:18px;border:0;border-radius:999px;background:var(--pink);color:var(--ink);margin-top:18px;cursor:pointer}
.next[disabled]{opacity:.45;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:16px;color:var(--mute)}
.row a{color:var(--mute);text-decoration:underline;cursor:pointer}
.tick{color:#1d7a3a;font-weight:700}.err{color:#b4006a}
.done{text-align:center;padding:50px 10px}.done h1{font-size:60px}.done .dot{width:16px;height:16px;border-radius:50%;background:var(--pink);margin:18px auto;animation:p 1.4s infinite}
@keyframes p{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
.dots{display:flex;gap:6px;margin:0 0 22px}.dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--violet)}
pre{white-space:pre-wrap;background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;font:17px/1.45 Arial,Helvetica,sans-serif;color:var(--ink)}
.team{background:var(--ink);color:var(--paper);border-radius:14px;padding:16px 18px;margin:0 0 16px;font-weight:700}
#code{position:fixed;right:10px;bottom:8px;font-size:12px;color:var(--mute)}
</style></head><body>
<main id="m"></main><div id="code"></div>
<script>
const CFG={"STAGES":[{"n":0,"name":"Arrive","done":"Thanks. We'll begin shortly."},{"n":1,"name":"Quadrant","done":"Look up."},{"n":2,"name":"Your thing","done":"That's your thing. Look up."},{"n":3,"name":"Notice","lens":"01  NOTICE","ask":"What's the uncertainty in front of you that's making you want to leave the room?","done":"Noticed. Look up."},{"n":4,"name":"Space","lens":"02  SPACE","ask":"Have you given this any space, or only more attention?","done":"Look up."},{"n":5,"name":"Choose","lens":"03  CHOOSE","ask":"How much of what you're waiting for is real information, and how much is so you don't have to feel uncertain?","done":"Chosen. Look up."},{"n":6,"name":"Practise","lens":"04  PRACTISE","ask":"What would you do if you weren't thinking about how it looked?","done":"That's your first move. Look up."},{"n":7,"name":"After","done":"Thank you. Look up."},{"n":8,"name":"Prompt","done":""}],"QUESTIONS":{"0":[{"key":"q1","type":"choice","label":"Your most common kind of procrastination","options":["Researching the decision","Another meeting","Rewriting the plan","Helping someone else","The tidy inbox","Honestly, nothing"]},{"key":"q2","type":"choice","label":"How many other things are you doing right now?","options":["None","One","Two","Three or more"]},{"key":"q3","type":"choice","label":"The biggest uncertainty facing you at work","options":["AI","Restructuring or job security","Budget","Customers or market","Leadership or strategy","Something else"]},{"key":"q4","type":"choice","label":"When it comes to using AI, I feel…","options":["Mostly excited","A bit excited","A bit uncertain","Very uncertain"]},{"key":"q5","type":"choice","label":"I know there are AI tools that could help me achieve more, but if I'm honest I'm procrastinating about them rather than exploring them.","options":["Yes, that's me","Partly","No, I'm on it"]}],"1":[{"key":"quadrant","type":"choice","label":"Which one are you, today?","options":["The Withdrawn Sceptic","The Overextended Enthusiast","The Compliant Middle","The Curious Experimenter"]}],"2":[{"key":"hold","type":"choice","label":"Is there an AI tool, or a thing AI could do for you, that you suspect would genuinely help, and you keep not getting round to?","options":["Yes","Yes, more than one","No, I'm on it"]},{"key":"f1","type":"text","label":"What is it? The name if you know it, or just what it would do."},{"key":"f2","type":"text","label":"What would you try with it, if you had an hour and nobody was watching?"},{"key":"f3","type":"text","label":"What would make that hour fun, rather than homework?"},{"key":"cpre","type":"scale","label":"How confident are you that you'll make a start on it in the next seven days?","lo":"Not at all","hi":"Certain"},{"key":"kpre","type":"scale","label":"How curious and playful do you feel about it?","lo":"Not at all","hi":"Very"}],"3":[{"key":"n1","type":"text","label":"The bit I'm not sure about is…"},{"key":"b4","type":"choice","label":"Which is closest?","options":["What if this exposes me","I don't know what to do with it","Nothing is moving"]}],"4":[{"key":"s1","type":"text","label":"What did you notice when you stopped staring at it?"},{"key":"s2","type":"text","label":"Where in the next week does it already have a bit of space?"}],"5":[{"key":"c1","type":"choice","label":"What are you actually waiting for?","options":["Mostly information","Mostly comfort","Honestly, both"]},{"key":"c2","type":"choice","label":"Pick one move","options":["A pause with a date","One piece of information I'll go and get","The smallest useful thing before tomorrow"]},{"key":"c3","type":"text","label":"Which, specifically?"}],"6":[{"key":"p2","type":"text","label":"My first move is ___"},{"key":"p3","type":"choice","label":"…on","options":["Tomorrow","Thursday","Friday","Next Monday","Next Tuesday"]},{"key":"p4","type":"text","label":"If ___ gets in the way, I will ___"}],"7":[{"key":"cpost","type":"scale","label":"How confident are you that you'll make a start on it in the next seven days?","lo":"Not at all","hi":"Certain"},{"key":"kpost","type":"scale","label":"How curious and playful do you feel about it?","lo":"Not at all","hi":"Very"},{"key":"b16","type":"choice","label":"Did you feel a shift?","options":["Yes","A bit","No"]},{"key":"email","type":"email","label":"Your email, so tonight's reflection and your prompt come back to you.","help":"Only you see your answers. The room only ever sees totals."},{"key":"consent","type":"choice","label":"Can we email you on Thursday and the next two Tuesdays with a top-up prompt?","options":["Yes","No"]},{"key":"team","type":"choice","label":"I'd like to talk about running this with my team","options":["Yes","No"]}],"8":[]},"PROMPT_GENERIC":"I'm working on something I've been putting off with AI. Here it is: [paste the thing you wrote today].\nBefore the session my confidence I'd start it this week was [before]/10 and my curiosity about it was [curiosity]/10. After, confidence was [after]/10.\n\nBe a playful, practical build partner, not a coach and not a cheerleader. No tool connections, nothing that sends, edits or deletes anything. Read-only, made-up data if I'm unsure.\nAsk me the four questions one at a time, waiting for each answer: what's the uncertainty in front of me that makes me want to leave the room; have I given this any space or only more attention; how much of what I'm waiting for is real information and how much is so I don't have to feel uncertain; what would I do if I weren't thinking about how it looked.\nThen ask me to restate my first move and its day. Suggest one 25-minute slot this week called \"Procrastination\" to noodle on this with you, and tell me to put it in my diary where colleagues can see it. Each time I come back, ask what happened, keep what helped, and nudge me to the next smallest thing. Challenge me once, in three sentences, if I'm researching instead of doing. Keep it short. Start with question one only.","api":"https://tzacvgixagqfydugnfdk.supabase.co/functions/v1/pn"};
const $=s=>document.querySelector(s);
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&3|8)).toString(16)});
const L=k=>{try{return localStorage.getItem(k)}catch(e){return null}};const S=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let pid=L('pn_pid');if(!pid){pid=uuid();S('pn_pid',pid)}
let ans=JSON.parse(L('pn_ans')||'{}'),saved=JSON.parse(L('pn_saved')||'{}'),pos=JSON.parse(L('pn_pos')||'{}');
let stage=-1,busy=false,queue={},lastErr='';
if(L('pn_code'))$('#code').textContent='#'+L('pn_code');
const base=CFG.api||location.pathname.replace(/\/+$/,'');const TEST=new URLSearchParams(location.search).get('test')==='1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function qs(){return CFG.QUESTIONS[stage]||[]}
function thing(){const a=(ans.f1||'').trim(),b=(ans.f2||'').trim();return a||b?(a?'<b>'+esc(a)+'</b>':'')+(a&&b?'<br>':'')+esc(b):''}
function render(){
  const m=$('#m');const st=CFG.STAGES[stage];
  if(stage<0){m.innerHTML='<div class="done"><h1>Nearly there</h1><div class="dot"></div><p class="help">Keep this page open.</p></div>';return}
  if(stage===8){let h='<h1>Your tool, to keep</h1>';if(ans.team==='Yes')h+='<div class="team">You said you\'d like to talk about your team. We\'ll be in touch.</div>';
    h+='<p class="help">The full version, with your answers already in it, is in your inbox tonight. This is the one to paste into whatever AI you already use. Your organisation\'s approved tool for anything about work, no names.</p><pre id="pr">'+esc(CFG.PROMPT_GENERIC)+'</pre><button class="next" onclick="navigator.clipboard.writeText(document.getElementById(\'pr\').textContent).then(()=>this.textContent=\'Copied\')">Copy the prompt</button>';m.innerHTML=h;return}
  const list=qs();let i=Math.min(pos[stage]||0,list.length);
  let h='';
  if(stage>=3&&stage<=6){const t=thing();if(t)h+='<div class="thing"><small>YOUR THING</small>'+t+'</div>';h+='<div class="lens">'+esc(st.lens)+'</div><p class="ask">'+esc(st.ask)+'</p>'}
  if(i>=list.length){h+='<div class="done"><h1>'+esc(st.done)+'</h1><div class="dot"></div>'+(list.length?'<p class="help"><a onclick="back()" style="cursor:pointer;text-decoration:underline">Change an answer</a></p>':'')+'</div>';m.innerHTML=h;return}
  const q=list[i];const v=ans[q.key]||'';
  h+='<div class="dots">'+list.map((_,k)=>'<i class="'+(k<=i?'on':'')+'"></i>').join('')+'</div>';
  h+='<h1>'+esc(q.label)+'</h1>'+(q.help?'<p class="help">'+esc(q.help)+'</p>':'');
  if(q.type==='choice')h+='<div class="opts">'+q.options.map(o=>'<button type="button" class="'+(v===o?'on':'')+'" onclick="pick(\''+q.key+'\',this.textContent)">'+esc(o)+'</button>').join('')+'</div>';
  else if(q.type==='multi'){const set=new Set(v?v.split('|'):[]);h+='<div class="opts">'+q.options.map(o=>'<button type="button" class="'+(set.has(o)?'on':'')+'" onclick="tog(\''+q.key+'\',this.textContent)">'+esc(o)+'</button>').join('')+'</div><button class="next" onclick="next()">Next</button>'}
  else if(q.type==='scale')h+='<div class="scale">'+Array.from({length:11},(_,k)=>'<button type="button" class="'+(v===String(k)?'on':'')+'" onclick="pick(\''+q.key+'\',\''+k+'\')">'+k+'</button>').join('')+'</div><div class="ends"><span>'+esc(q.lo)+'</span><span>'+esc(q.hi)+'</span></div>';
  else if(q.type==='text')h+='<textarea id="in" maxlength="600" oninput="typed(\''+q.key+'\',this.value)" placeholder="Type here">'+esc(v)+'</textarea><button class="next" id="nx" onclick="next()">Next</button>';
  else if(q.type==='email')h+='<input id="in" type="email" inputmode="email" autocomplete="email" placeholder="you@work.com" value="'+esc(v)+'" oninput="typed(\''+q.key+'\',this.value)"><button class="next" id="nx" onclick="next()">Next</button>';
  h+='<div class="row"><span id="stt"></span>'+(i>0?'<a onclick="back()">Back</a>':'<span></span>')+'</div>';
  m.innerHTML=h;status();const el=$('#in');if(el&&q.type==='text')el.focus();
}
function status(){const el=$('#stt');if(!el)return;const q=qs()[pos[stage]||0];if(!q)return;const v=(ans[q.key]||'').trim();
  if(lastErr)el.innerHTML='<span class="err">Not saved: '+esc(lastErr)+'. Retrying.</span>';else if(v&&saved[q.key]===v)el.innerHTML='<span class="tick">Saved</span>';else if(v)el.textContent='Saving';else el.textContent=''}
function setA(k,v){ans[k]=v;S('pn_ans',JSON.stringify(ans))}
let t;function typed(k,v){setA(k,v);clearTimeout(t);t=setTimeout(()=>flush(),900);status()}
function pick(k,v){setA(k,v);render();flush();setTimeout(next,320)}
function tog(k,o){const set=new Set(ans[k]?ans[k].split('|'):[]);if(o==='None of these'){set.clear();set.add(o)}else{set.delete('None of these');set.has(o)?set.delete(o):set.add(o)}setA(k,[...set].join('|'));render();flush()}
function next(){const list=qs();const i=pos[stage]||0;const q=list[i];
  if(q&&q.type==='email'){const v=(ans.email||'').trim();if(!EMAIL.test(v)){lastErr='';const el=$('#stt');if(el)el.innerHTML='<span class="err">That email doesn\'t look right.</span>';return}}
  flush();pos[stage]=Math.min(i+1,list.length);S('pn_pos',JSON.stringify(pos));render();window.scrollTo(0,0)}
function back(){const i=pos[stage]||0;pos[stage]=Math.max(0,Math.min(i,qs().length)-1);S('pn_pos',JSON.stringify(pos));render()}
async function flush(){
  const payload={};for(const s in CFG.QUESTIONS)for(const q of CFG.QUESTIONS[s]){const v=(ans[q.key]||'').trim();if(!v||saved[q.key]===v)continue;if(q.type==='email'&&!EMAIL.test(v))continue;payload[q.key]=v}
  if(!Object.keys(payload).length||busy)return;busy=true;
  try{const r=await fetch(base+'/api/answer',{method:'POST',headers:Object.assign({'content-type':'application/json'},TEST?{'x-pn-test':'1'}:{}),cache:'no-store',body:JSON.stringify({pid,answers:payload})});
    if(!r.ok){let e='';try{e=(await r.json()).error||''}catch(x){}throw new Error(e||('HTTP '+r.status))}
    const j=await r.json();for(const k of j.saved)saved[k]=payload[k];if(payload.email&&j.ok)saved.email=payload.email;S('pn_saved',JSON.stringify(saved));
    if(j.code){S('pn_code',j.code);$('#code').textContent='#'+j.code}lastErr='';status()}
  catch(e){lastErr=(e&&e.message)||'network';status();setTimeout(flush,4000)}
  finally{busy=false}
}
async function poll(){try{const r=await fetch(base+'/api/stage',{cache:'no-store'});const j=await r.json();if(j.stage!==stage){stage=j.stage;render();window.scrollTo(0,0)}}catch(e){}setTimeout(poll,3000)}
poll();setInterval(flush,6000);
</script></body></html>
