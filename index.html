<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Procrastination Nation</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--paper:#E8E6FF;--ink:#251F20;--pink:#FF4DFF;--violet:#5639FF;--mute:rgba(37,31,32,.62);--line:rgba(37,31,32,.2)}
*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.4 Aptos,Arial,Helvetica,sans-serif;min-height:100vh}
main{max-width:680px;margin:0 auto;padding:28px 18px 60px}
@media (min-width:700px){body{font-size:21px}main{padding:56px 24px 80px}}
.thing{background:var(--violet);color:#fff;border-radius:14px;padding:14px 18px;margin:0 0 26px;font-size:18px;line-height:1.35}
.thing small{display:block;font:15px/1 'Bebas Neue',Arial,sans-serif;letter-spacing:.1em;color:var(--pink);margin-bottom:6px}
.lens{font:22px/1 'Bebas Neue',Arial,sans-serif;letter-spacing:.1em;color:var(--violet);margin:0 0 10px}
.ask{color:var(--mute);margin:0 0 22px;font-size:17px}
h1{font:46px/1.02 'Bebas Neue',Arial,sans-serif;letter-spacing:.01em;margin:0 0 10px;color:var(--ink)}
@media (min-width:700px){h1{font-size:62px}}
.help{color:var(--mute);margin:0 0 18px;font-size:17px}
.opts button{display:block;width:100%;text-align:left;font:inherit;padding:14px 18px;margin:10px 0;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
.opts button .hint{display:block;font-size:17px;font-weight:400;color:var(--mute);margin-top:4px}
.opts button.on .hint{color:var(--paper);opacity:.85}
.opts button.on{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:700}
.scale{display:grid;grid-template-columns:repeat(var(--n,11),1fr);gap:8px;margin-top:8px}
.scale button{font:inherit;font-size:24px;font-weight:700;padding:18px 0;border:2px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer}
.scale button.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.ends{display:flex;justify-content:space-between;font-size:16px;color:var(--mute);margin-top:8px}
textarea,input[type=email]{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-top:6px}
textarea{min-height:110px;resize:vertical}textarea:focus,input:focus{outline:none;border-color:var(--violet)}
.next{display:block;width:100%;font:28px/1 'Bebas Neue',Arial,sans-serif;letter-spacing:.08em;padding:18px;border:0;border-radius:999px;background:var(--pink);color:var(--ink);margin-top:18px;cursor:pointer}
.next[disabled]{opacity:.45;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:16px;color:var(--mute)}
.row a{color:var(--mute);text-decoration:underline;cursor:pointer}
.tick{color:#1d7a3a;font-weight:700}.err{color:#b4006a}
.done{text-align:center;padding:50px 10px}.done h1{font-size:60px}.done .dot{width:16px;height:16px;border-radius:50%;background:var(--pink);margin:18px auto;animation:p 1.4s infinite}
@keyframes p{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
.dots{display:flex;gap:6px;margin:0 0 22px}.dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--violet)}
pre{white-space:pre-wrap;background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;font:17px/1.45 Arial,Helvetica,sans-serif;color:var(--ink)}
.res{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 18px;margin:10px 0}.res span{font-size:17px;color:var(--mute)}.res b{font:34px/1 'Bebas Neue',Arial,sans-serif;white-space:nowrap;margin-left:12px}.res i{font-style:normal;color:var(--pink)}
.team{background:var(--ink);color:var(--paper);border-radius:14px;padding:16px 18px;margin:0 0 16px;font-weight:700}
#code{position:fixed;right:10px;bottom:8px;font-size:12px;color:var(--mute)}
</style></head><body>
<main id="m"></main><div id="code"></div>
<script>
const CFG={"STAGES":[{"n":0,"name":"Arrive","done":"Thank you. Look up."},{"n":1,"name":"Your idea","done":"That's your AI idea. Look up."},{"n":2,"name":"Which one","done":"Look up."},{"n":3,"name":"Notice","lens":"01  NOTICE","done":"Noticed. Look up."},{"n":4,"name":"Space","lens":"02  SPACE","done":"Look up."},{"n":5,"name":"Leap","lens":"03  LEAP","done":"Look up."},{"n":6,"name":"Practise","lens":"04  PRACTISE","done":"Look up."},{"n":7,"name":"After","done":"Thank you. Look up."},{"n":8,"name":"Thanks","done":""}],"QUESTIONS":{"0":[{"key":"intro","type":"intro","label":"Your answers are private.","help":"Nobody in the session sees your name, only totals. Answer instinctively. You can stop at any time.","button":"Start"},{"key":"q1","type":"choice","label":"In the last few weeks, what's been your procrastination of choice?","options":["Researching instead of deciding","Another meeting in the diary","Rewriting the plan","Fixing someone else's problem","A tidy inbox on deadline day","I never procrastinate"]},{"key":"q2","type":"choice","label":"This minute, how much are you procrastinating?","options":["Totally focused on Sam and Katherine","One eye on my emails","Toggling the tabs, as usual","Scrolling cats while booking a holiday"]},{"key":"q3","type":"choice","label":"How much is AI on your organisation's mind right now?","options":["It's all anyone talks about","Pushed from the top, eye-rolls back","Some teams, not others","Resisting it, partly for the planet","Barely mentioned"]},{"key":"q4t","type":"choice","label":"Over the last few months, when you've thought about how AI is affecting your job, has it been…","options":["A definite opportunity","Mostly an opportunity","A bit of both","Mostly a threat","A clear threat"]},{"key":"q4","type":"choice","label":"And over the last few months, in your body or belly, how have you felt about AI and your career?","options":["Really uneasy","Slightly uneasy","A bit of a mix","Quietly excited","Really excited"]},{"key":"q5","type":"choice","label":"Over the last few months, where have you been on the AI curve?","options":["Five agents, building daily","Confident with one tool","Trying my best","Further behind than I'd like","Overwhelmed, and resentful"]}],"1":[{"key":"a1","type":"choice","label":"Is there an AI tool you believe could save you time, but you haven't properly started using?","options":["Yes","Yes, more than one","So many I can't count","No, I'm 100% on top of every AI tool"]},{"key":"a2","type":"choice","label":"What's stopped you engaging with it?","showIf":{"a1":["Yes","Yes, more than one","So many I can't count"]},"options":["No time","Don't know where to start","Above my skill set","Feels like more work, not less","Worried it could take my job"]},{"key":"f1","type":"text","label":"If you woke up tomorrow confident and curious with AI, what's the first thing you'd use it for?","help":"One line. It stays at the top of your phone for the next part."},{"key":"lpre","type":"scale","min":1,"max":5,"label":"Realistically, how likely are you to start using AI properly in the next five days?","lo":"Very unlikely","hi":"Very likely"},{"key":"cpre","type":"scale","min":1,"max":5,"label":"How confident are you that you'd know where to start?","lo":"Not at all","hi":"Very"},{"key":"hpre","type":"scale","min":1,"max":5,"label":"If you brought AI into your life properly, how sure are you it would help?","lo":"Not at all","hi":"Very sure"},{"key":"k1pre","type":"scale","min":1,"max":5,"label":"I'd go out of my way to find out more about it.","lo":"Not like me","hi":"Very like me"},{"key":"k2pre","type":"scale","min":1,"max":5,"label":"I'd enjoy not knowing exactly how it turns out.","lo":"Not like me","hi":"Very like me"},{"key":"k3pre","type":"scale","min":1,"max":5,"label":"Trying it would be a chance to learn something.","lo":"Not like me","hi":"Very like me"}],"2":[{"key":"quadrant","type":"choice","label":"Which one are you, today?","options":["The Compliant Middle","The Overextended Enthusiast","The Withdrawn Sceptic","The Curious Experimenter"]}],"3":[{"key":"ns","type":"choice","label":"In the last few weeks, when you've thought about exploring AI beyond your comfort zone, what showed up first?","help":"The feeling or thought just before you put it off.","options":["Fear: a knot of anxiety","Fog: where would I even start?","Stasis: I'll do it when things calm down","Irritation: why should I have to?","A sudden urge to tidy my inbox"]},{"key":"nm","type":"text","label":"What might that signal be telling you?","help":"For example: \"It might do my job better than me.\" Or: \"I'll look stupid.\" One line."}],"4":[{"key":"s1","type":"choice","label":"Honestly, how much curious, experimental time with no brief have you spent with AI this month?","options":["Not a minute","Thought about it a lot (does that count?)","Read and watched, not played","Had a proper play"]},{"key":"s2","type":"choice","label":"What would turn your relationship with AI into a playful, curious love affair?","options":["A Claude double date","An AI book club","A secret society of builders","An hour, a made-up brief, no stakes","Something else"]}],"5":[{"key":"l1","type":"choice","label":"Where do you feel you are on your AI journey?","options":["Too late, I'll never catch up","Behind, but I could catch up","About right","Ahead, honestly"]},{"key":"l2","type":"choice","label":"If you knew it would give you the edge, how much of your procrastination time would you give to playing with AI?","options":["Ten minutes of my scrolling a day","An hour of my Netflix a week","A whole evening","None, honestly"]}],"6":[{"key":"p1","type":"choice","label":"If you gave some of your procrastination time to playing with AI for the next couple of weeks, how might you start to feel about it?","options":["Curious","More confident","Less behind","Like it's actually fun","Same as now"]},{"key":"p3","type":"choice","label":"What would it cost you to give some procrastination time to playing with AI over the next few weeks?","options":["Nothing, honestly","A little","Quite a lot"]},{"key":"p4","type":"text","label":"And honestly, what has not playing with AI cost you over the last six months?","help":"One line."}],"7":[{"key":"meta","type":"scale","min":1,"max":5,"label":"How much benefit have you got from an hour procrastinating about AI?","lo":"None at all","hi":"Loads"},{"key":"lpost","type":"scale","min":1,"max":5,"label":"Realistically, how likely are you to start using AI properly in the next five days?","lo":"Very unlikely","hi":"Very likely"},{"key":"cpost","type":"scale","min":1,"max":5,"label":"How confident are you that you'd know where to start?","lo":"Not at all","hi":"Very"},{"key":"hpost","type":"scale","min":1,"max":5,"label":"If you brought AI into your life properly, how sure are you it would help?","lo":"Not at all","hi":"Very sure"},{"key":"k1post","type":"scale","min":1,"max":5,"label":"I'd go out of my way to find out more about it.","lo":"Not like me","hi":"Very like me"},{"key":"k2post","type":"scale","min":1,"max":5,"label":"I'd enjoy not knowing exactly how it turns out.","lo":"Not like me","hi":"Very like me"},{"key":"k3post","type":"scale","min":1,"max":5,"label":"Trying it would be a chance to learn something.","lo":"Not like me","hi":"Very like me"},{"key":"q4tpost","type":"choice","label":"Over the next week, how do you want to think about AI and your job?","options":["A definite opportunity","Mostly an opportunity","A bit of both","Mostly a threat","A clear threat"]},{"key":"q4post","type":"choice","label":"And over the next week, how do you want to feel about it, in your body or belly?","options":["Really uneasy","Slightly uneasy","A bit of a mix","Quietly excited","Really excited"]},{"key":"q5post","type":"choice","label":"Over the next week, where do you want to be on the AI curve?","options":["Five agents, building daily","Confident with one tool","Trying my best","Further behind than I'd like","Overwhelmed, and resentful"]},{"key":"gloves","type":"intro","label":"Gloves off.","help":"This one's personal. Use whichever AI you're allowed to: your own is fine, and so is your organisation's approved tool. Your next answers become your prompt: three playful 15-minute bursts this week.","button":"Go"},{"key":"w1","type":"choice","label":"If AI really were a magic wand, who in your life would you love to surprise with something you'd made?","help":"Anyone counts, at home or at work.","options":["My partner","One of my kids","A friend","A parent","Someone at work","Me, honestly"]},{"key":"w2","type":"text","label":"What would genuinely delight them, or make their day a little easier?","help":"One line, just for your prompt. Nobody else sees it. Made-up is fine. Please don't name anyone."},{"key":"w3","type":"choice","label":"And if they loved it, how would you feel?","options":["Chuffed","Proud","A bit of a legend","Closer to them","Like I'd finally got AI"]},{"key":"l3","type":"choice","label":"When will you start your positive procrastination journey?","options":["Tonight","Tomorrow","This week","This weekend","Not sure yet"]},{"key":"thread","type":"consent","label":"Want the week's nudges?","help":"A prompt built from today's answers, tonight. Then one short line each morning until Friday. Four emails, then we stop.","privacy":"Your answers sit behind a private code. The session sees totals only. Your email is used for these four messages and then deleted.","options":["yes","skipped"],"skip":"No thanks, skip"},{"key":"team","type":"choice","label":"Got a team and a budget? Want to talk about an Uncertainty Lab?","options":["Yes, call me","Send me something to forward","Bring this hour to my team","Not now"]},{"key":"when","type":"choice","label":"When would you want it?","options":["This quarter","Next quarter","Just exploring"],"showIf":{"team":"Yes, call me"}},{"key":"email","type":"email","label":"Where should we reach you?","showIf":{"team":["Yes, call me","Send me something to forward","Bring this hour to my team"],"email":null},"skip":"No thanks, skip"}],"8":[]},"PROMPT_GENERIC":"Your job is to help me make one small, playful thing with AI this week, for someone I'd love to surprise. Today is burst one, about fifteen minutes. Not a plan: a rough first version, made here.\n\nWhat I said at Procrastination Nation:\nWho I'd love to surprise: {w1}\nWhat would delight them: {w2}\nHow I'd feel if they loved it: {w3}\nMy first fifteen minutes: {l3}\n\nWhat we learned there: procrastination is about how we feel, not how we manage our time. So this week starts from a good feeling, not a to-do list: three short, playful bursts, with rest in between so ideas can percolate.\n\nUse only what I type in this conversation; don't look anything up or ask me to paste anything. Don't ask for names or anything confidential; if I share any, swap in a placeholder and carry on.\n\nThe protocol:\n1. Open with two plain sentences reminding me what we learned at Procrastination Nation and how this week works. Then read my four lines back word for word. Then one sentence on why the feeling I chose is the point and the thing we make is just the way in, using my words, with no praise. Then say \"Three quick questions, then we make a first version.\" Then ask Question 1.\n2. One question at a time, labelled \"Question 1 of 3\" to \"Question 3 of 3\". Keep every reply under 80 words unless you're making something. End each message with the question, nothing after it, and wait.\n3. After each answer, reflect it back in one plain sentence, in my words, with no analysis or praise.\n4. If an answer is thin, ask once for one concrete example, then move on. If I say \"not sure\", offer two made-up options and let me pick.\n5. \"skip\" moves on, \"back\" repeats the last question, \"restart\" begins again.\n\nThe three questions:\nQuestion 1 of 3: Picture it working for them. What three things might it do?\nQuestion 2 of 3: Which one shall we make first? (list my three, numbered)\nQuestion 3 of 3: What part of making that one don't you know how to do yet?\n\nAfter my third answer, and not before: say in two lines what we're making and ask \"Yes, tweak, or skip?\" Once I say yes, make a rough first version and show the whole thing, starting with the part I don't know how to do (if it's code, one line first on how to open it). Ask one question about it, then improve it once.\n\nThen close with exactly: \"That's enough for today. Go and percolate. Leave it alone tomorrow. On Thursday, come back to this chat and tell me what happened, even if the answer is nothing.\" Then three lines headed \"Where we got to (burst 1 of 3)\": who it's for, what we made, what's next. Your reply ends with that note: no sign-off, no offer, no question.\n\nThroughout: a playful, practical build partner, not a coach or cheerleader. Never praise me or my ideas, never say \"sounds like\" or \"very common\". If I mention a worry, don't respond to it: carry on making.\n\nBegin now.","api":"https://tzacvgixagqfydugnfdk.supabase.co/functions/v1/pn"};
const $=s=>document.querySelector(s);
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&3|8)).toString(16)});
const L=k=>{try{return localStorage.getItem(k)}catch(e){return null}};const S=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let pid=L('pn_pid');if(!pid){pid=uuid();S('pn_pid',pid)}
let ans=JSON.parse(L('pn_ans')||'{}'),saved=JSON.parse(L('pn_saved')||'{}'),pos=JSON.parse(L('pn_pos')||'{}');
let stage=-1,busy=false,queue={},lastErr='';
if(L('pn_code'))$('#code').textContent='#'+L('pn_code');
const base=CFG.api||location.pathname.replace(/\/+$/,'');const TEST=new URLSearchParams(location.search).get('test')||'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const showOk=q=>!q.showIf||Object.entries(q.showIf).every(([k,v])=>v===null?!(ans[k]||'').trim():Array.isArray(v)?v.includes(ans[k]):ans[k]===v);
function qs(){return (CFG.QUESTIONS[stage]||[]).filter(showOk)}
function thing(){const a=(ans.f1||'').trim();return a?esc(a):''}
function render(){
  const m=$('#m');const st=CFG.STAGES[stage];
  if(stage<0){m.innerHTML='<div class="done"><h1>Nearly there</h1><div class="dot"></div><p class="help">Keep this page open.</p></div>';return}
  if(stage===8){const num=k=>{const v=+ans[k];return ans[k]===undefined||ans[k]===''||isNaN(v)?null:v};
    const cur=sfx=>{const xs=['k1','k2','k3'].map(k=>num(k+sfx));return xs.some(x=>x===null)?null:Math.round(xs.reduce((a,b)=>a+b,0)/3*10)/10};
    const row=(lab,a,b)=>'<div class="res"><span>'+lab+'</span><b>'+(a===null?'–':a)+' <i>→</i> '+(b===null?'–':b)+'</b></div>';
    let h='<h1>Your results</h1><p class="help">Before and after, out of 5. Only you see these.</p>'+row('Likely to start this week',num('lpre'),num('lpost'))+row('Confident where to start',num('cpre'),num('cpost'))+row('Sure AI would help',num('hpre'),num('hpost'))+row('Curious about it',cur('pre'),cur('post'));
    if(ans.team&&ans.team!=='Not now'&&!(ans.email||'').trim()&&!ans.emailskip)h+='<div class="res" style="display:block"><span>Where should we reach you?</span><input id="lem" type="email" inputmode="email" autocomplete="email" placeholder="you@work.com"><button class="next" onclick="saveEmail()">Send</button><p class="help" style="text-align:center;margin:10px 0 0"><span id="lerr" class="err"></span> <a onclick="skipEmail()" style="cursor:pointer;text-decoration:underline">No thanks, skip</a></p></div>';
    else if(ans.team==='Yes, call me'){h+='<div class="team">Thank you. Within two working days: dates, a straight figure for your team, and what happens next.</div>';
      if(!ans.when)h+='<div class="res" style="display:block"><span>When would you want it?</span><div class="opts" style="margin-top:8px">'+['This quarter','Next quarter','Just exploring'].map(o=>'<button type="button" onclick="pickWhen(this.textContent)">'+o+'</button>').join('')+'</div></div>'}
    else if(ans.team==='Send me something to forward')h+='<div class="team">Here is the one-page outline to forward: <a href="Uncertainty_Lab_One_Pager.pdf" target="_blank" rel="noopener">Uncertainty Lab outline (PDF)</a>. We\'ll email it to you too.</div>';
    else if(ans.team==='Bring this hour to my team')h+='<div class="team">Thank you. We\'ll be in touch within two working days about bringing this hour to your team.</div>';
    else h+='<div class="res" style="display:block"><span>Got a team and a budget? Want to talk about an Uncertainty Lab?</span><div class="opts" style="margin-top:8px">'+['Yes, call me','Send me something to forward','Bring this hour to my team'].map(o=>'<button type="button" onclick="lead(this.textContent)">'+o+'</button>').join('')+'</div></div>';
    if(CFG.PROMPT_GENERIC){const fill=t=>t.replace(/\{(w[123]|f[123]|n1|l3)\}/g,(_,k)=>(ans[k]||'').trim().replace(/[.\s]+$/,'')||'I didn\'t write one');
      h+='<h1 style="margin-top:28px">Your prompt</h1><p class="help">Paste it into whichever AI you already use. For anything about work, use your organisation\'s approved tool. Made-up data is fine.</p><pre id="pr">'+esc(fill(CFG.PROMPT_GENERIC))+'</pre><button class="next" onclick="cp()">Copy the prompt</button>'}
    m.innerHTML=h;return}
  const list=qs();let i=Math.min(pos[stage]||0,list.length);
  let h='';
  if(stage>=3&&stage<=6){const t=thing();if(t)h+='<div class="thing"><small>IF I WOKE UP CONFIDENT</small>'+t+'</div>';h+='<div class="lens">'+esc(st.lens)+'</div>'+(st.ask?'<p class="ask">'+esc(st.ask)+'</p>':'')}
  if(i>=list.length){h+='<div class="done"><h1>'+esc(st.done)+'</h1><div class="dot"></div>'+(list.length?'<p class="help"><a onclick="back()" style="cursor:pointer;text-decoration:underline">Change an answer</a></p>':'')+'</div>';m.innerHTML=h;return}
  const q=list[i];const v=ans[q.key]||'';
  if(q.type!=='intro')h+='<div class="dots">'+list.filter(x=>x.type!=='intro').map((_,k)=>'<i class="'+(k<list.slice(0,i+1).filter(x=>x.type!=='intro').length?'on':'')+'"></i>').join('')+'</div>';
  h+='<h1>'+esc(q.label)+'</h1>'+(q.help?'<p class="help">'+esc(q.help)+'</p>':'');
  if(q.type==='choice')h+='<div class="opts">'+q.options.map(o=>'<button type="button" class="'+(v===o?'on':'')+'" data-v="'+esc(o)+'" onclick="pick(\''+q.key+'\',this.dataset.v)">'+esc(o)+(q.hints&&q.hints[o]?'<span class="hint">'+esc(q.hints[o])+'</span>':'')+'</button>').join('')+'</div>';
  else if(q.type==='multi'){const set=new Set(v?v.split('|'):[]);h+='<div class="opts">'+q.options.map(o=>'<button type="button" class="'+(set.has(o)?'on':'')+'" onclick="tog(\''+q.key+'\',this.textContent)">'+esc(o)+'</button>').join('')+'</div><button class="next" onclick="next()">Next</button>'}
  else if(q.type==='scale'){const lo=q.min??0,hi=q.max??10;h+='<div class="scale" style="--n:'+(hi-lo+1)+'">'+Array.from({length:hi-lo+1},(_,j)=>j+lo).map(k=>'<button type="button" class="'+(v===String(k)?'on':'')+'" onclick="pick(\''+q.key+'\',\''+k+'\')">'+k+'</button>').join('')+'</div><div class="ends"><span>'+esc(q.lo)+'</span><span>'+esc(q.hi)+'</span></div>'}
  else if(q.type==='text')h+='<textarea id="in" maxlength="600" oninput="typed(\''+q.key+'\',this.value)" placeholder="Type here">'+esc(v)+'</textarea><button class="next" id="nx" onclick="next()">Next</button>';
  else if(q.type==='email')h+='<input id="in" type="email" inputmode="email" autocomplete="email" placeholder="you@work.com" value="'+esc(v)+'" oninput="typed(\''+q.key+'\',this.value)"><button class="next" id="nx" onclick="next()">Next</button>'+(q.skip?'<p class="help" style="text-align:center;margin-top:14px"><a onclick="next(true)" style="cursor:pointer;text-decoration:underline">'+esc(q.skip)+'</a></p>':'');
  else if(q.type==='consent')h+='<input id="in" type="email" inputmode="email" autocomplete="email" placeholder="you@work.com" value="'+esc(ans.email||'')+'" oninput="typed(\'email\',this.value)"><button class="next" id="nx" onclick="next()">Yes please</button><p class="help" style="text-align:center;margin-top:14px"><a onclick="next(true)" style="cursor:pointer;text-decoration:underline">'+esc(q.skip||'No thanks, skip')+'</a></p><p class="help" style="font-size:15px">'+esc(q.privacy||'')+'</p>';
  else if(q.type==='intro')h+='<button class="next" onclick="next()">'+esc(q.button||'Start')+'</button>';
  h+='<div class="row"><span id="stt"></span>'+(i>0?'<a onclick="back()">Back</a>':'<span></span>')+'</div>';
  m.innerHTML=h;status();const el=$('#in');if(el&&q.type==='text')el.focus();
}
function lead(v){setA('team',v);flush();render()}
function pickWhen(v){setA('when',v);flush();render()}
function saveEmail(){const v=(document.getElementById('lem').value||'').trim();if(!EMAIL.test(v)){document.getElementById('lerr').textContent='That email doesn\'t look right.';return}setA('email',v);flush();render()}
function skipEmail(){setA('emailskip','1');render()}
function cp(){const t=document.getElementById('pr').textContent;const b=document.querySelector('.next');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>b.textContent='Copied',()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('pr'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);b.textContent='Selected: press copy'})}
function status(){const el=$('#stt');if(!el)return;const q=qs()[pos[stage]||0];if(!q)return;const v=(ans[q.key]||'').trim();
  if(lastErr)el.innerHTML='<span class="err">Not saved: '+esc(lastErr)+'. Retrying.</span>';else if(v&&saved[q.key]===v)el.innerHTML='<span class="tick">Saved</span>';else if(v)el.textContent='Saving';else el.textContent=''}
function setA(k,v){ans[k]=v;S('pn_ans',JSON.stringify(ans))}
let t;function typed(k,v){setA(k,v);clearTimeout(t);t=setTimeout(()=>flush(),900);status()}
function pick(k,v){setA(k,v);render();flush();setTimeout(next,320)}
function tog(k,o){const set=new Set(ans[k]?ans[k].split('|'):[]);if(o==='None of these'){set.clear();set.add(o)}else{set.delete('None of these');set.has(o)?set.delete(o):set.add(o)}setA(k,[...set].join('|'));render();flush()}
function next(skip){const list=qs();const i=pos[stage]||0;const q=list[i];
  if(q&&q.type==='consent'){if(skip){setA(q.key,'skipped')}else{const v=(ans.email||'').trim();if(!EMAIL.test(v)){const el=$('#stt');if(el)el.innerHTML='<span class="err">That email doesn\'t look right.</span>';return}setA(q.key,'yes')}}
  if(q&&q.type==='email'&&!skip){const v=(ans.email||'').trim();if(!EMAIL.test(v)){lastErr='';const el=$('#stt');if(el)el.innerHTML='<span class="err">That email doesn\'t look right.</span>';return}}
  flush();pos[stage]=Math.min(i+1,list.length);S('pn_pos',JSON.stringify(pos));render();window.scrollTo(0,0)}
function back(){const i=pos[stage]||0;pos[stage]=Math.max(0,Math.min(i,qs().length)-1);S('pn_pos',JSON.stringify(pos));render()}
let dirty=false;
async function flush(){
  const payload={};for(const s in CFG.QUESTIONS)for(const q of CFG.QUESTIONS[s]){const v=(ans[q.key]||'').trim();if(!v||saved[q.key]===v)continue;if(q.type==='email'&&!EMAIL.test(v))continue;payload[q.key]=v}
  if(!Object.keys(payload).length)return;
  if(busy){dirty=true;return}
  busy=true;dirty=false;
  const ac=new AbortController();const timer=setTimeout(()=>ac.abort(),12000);
  try{const r=await fetch(base+'/api/answer',{method:'POST',headers:Object.assign({'content-type':'application/json'},TEST?{'x-pn-test':TEST}:{}),cache:'no-store',signal:ac.signal,body:JSON.stringify({pid,answers:payload})});
    if(!r.ok){let e='';try{e=(await r.json()).error||''}catch(x){}throw new Error(e||('HTTP '+r.status))}
    const j=await r.json();for(const k of j.saved)saved[k]=payload[k];if(payload.email&&j.ok)saved.email=payload.email;S('pn_saved',JSON.stringify(saved));
    if(j.code){S('pn_code',j.code);$('#code').textContent='#'+j.code}lastErr='';status()}
  catch(e){lastErr=(e&&e.name==='AbortError')?'slow connection':((e&&e.message)||'network');status();dirty=true}
  finally{clearTimeout(timer);busy=false;if(dirty)setTimeout(flush,lastErr?3000:150)}
}
const SJ=/\/functions\/v1\//.test(base)?base.replace(/\/functions\/v1\/.*$/,'')+'/storage/v1/object/public/pn-public/stage.json':'';
// Stage sync: stage.json (CDN, cheap) every 2.5 s, the function every 4th poll or when the file fails.
// The database answer always wins; the CDN file only moves a phone if it is at least as new, so a stale copy can never pull a phone back.
let pollT=0,pollBusy=false,pollN=0,stageT=0;
const tget=u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),4000);return fetch(u,{cache:'no-store',signal:c.signal}).then(r=>r.ok?r.json():null).catch(()=>null).finally(()=>clearTimeout(t))};
const tsOf=x=>{const n=Date.parse((x&&x.t)||'');return isNaN(n)?0:n};
function take(x,db){if(!x||typeof x.stage!=='number')return;const t=tsOf(x);if(x.stage===stage){if(db||t>stageT)stageT=t;return}if(!db&&t<stageT)return;stage=x.stage;stageT=t;render();window.scrollTo(0,0)}
async function poll(){if(pollBusy)return;pollBusy=true;clearTimeout(pollT);pollN++;
  try{const a=SJ?await tget(SJ+'?v='+Date.now()):null;take(a);
    if(!a||typeof a.stage!=='number'||pollN%4===0)take(await tget(base+'/api/stage'),true)}
  catch(e){}finally{pollBusy=false;pollT=setTimeout(poll,2500)}}
const wake=()=>{if(document.visibilityState!=='hidden'){pollN=3;poll()}};
document.addEventListener('visibilitychange',wake);window.addEventListener('focus',wake);window.addEventListener('pageshow',wake);document.addEventListener('resume',wake);
poll();setInterval(flush,4000);
</script></body></html>
