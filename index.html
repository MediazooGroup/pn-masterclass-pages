<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Procrastination Nation</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--paper:#E8E6FF;--ink:#251F20;--pink:#FF4DFF;--violet:#5639FF;--mute:rgba(37,31,32,.62);--line:rgba(37,31,32,.2)}
*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.4 Aptos,Arial,Helvetica,sans-serif;min-height:100vh}
main{max-width:680px;margin:0 auto;padding:28px 18px 60px}
@media (min-width:700px){body{font-size:21px}main{padding:56px 24px 80px}}
.thing{background:var(--violet);color:#fff;border-radius:14px;padding:14px 18px;margin:0 0 26px;font-size:18px;line-height:1.35}
.thing small{display:block;font:15px/1 'Bebas Neue',Arial,sans-serif;letter-spacing:.1em;color:var(--pink);margin-bottom:6px}
.lens{font:22px/1 'Bebas Neue',Arial,sans-serif;letter-spacing:.1em;color:var(--violet);margin:0 0 10px}
.ask{color:var(--mute);margin:0 0 22px;font-size:17px}
h1{font:46px/1.02 'Bebas Neue',Arial,sans-serif;letter-spacing:.01em;margin:0 0 10px;color:var(--ink)}
@media (min-width:700px){h1{font-size:62px}}
.help{color:var(--mute);margin:0 0 18px;font-size:17px}
.opts button{display:block;width:100%;text-align:left;font:inherit;padding:14px 18px;margin:10px 0;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
.opts button .hint{display:block;font-size:17px;font-weight:400;color:var(--mute);margin-top:4px}
.opts button.on .hint{color:var(--paper);opacity:.85}
.opts button.on{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:700}
.scale{display:grid;grid-template-columns:repeat(var(--n,11),1fr);gap:8px;margin-top:8px}
.scale button{font:inherit;font-size:24px;font-weight:700;padding:18px 0;border:2px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer}
.scale button.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.ends{display:flex;justify-content:space-between;font-size:16px;color:var(--mute);margin-top:8px}
textarea,input[type=email]{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-top:6px}
textarea{min-height:110px;resize:vertical}textarea:focus,input:focus{outline:none;border-color:var(--violet)}
.next{display:block;width:100%;font:28px/1 'Bebas Neue',Arial,sans-serif;letter-spacing:.08em;padding:18px;border:0;border-radius:999px;background:var(--pink);color:var(--ink);margin-top:18px;cursor:pointer}
.next[disabled]{opacity:.45;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:16px;color:var(--mute)}
.row a{color:var(--mute);text-decoration:underline;cursor:pointer}
.tick{color:#1d7a3a;font-weight:700}.err{color:#b4006a}
.done{text-align:center;padding:50px 10px}.done h1{font-size:60px}.done .dot{width:16px;height:16px;border-radius:50%;background:var(--pink);margin:18px auto;animation:p 1.4s infinite}
@keyframes p{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
.dots{display:flex;gap:6px;margin:0 0 22px}.dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--violet)}
pre{white-space:pre-wrap;background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;font:17px/1.45 Arial,Helvetica,sans-serif;color:var(--ink)}
.res{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 18px;margin:10px 0}.res span{font-size:17px;color:var(--mute)}.res b{font:34px/1 'Bebas Neue',Arial,sans-serif;white-space:nowrap;margin-left:12px}.res i{font-style:normal;color:var(--pink)}
.team{background:var(--ink);color:var(--paper);border-radius:14px;padding:16px 18px;margin:0 0 16px;font-weight:700}
#code{position:fixed;right:10px;bottom:8px;font-size:12px;color:var(--mute)}
</style></head><body>
<main id="m"></main><div id="code"></div>
<script>
const CFG={"STAGES":[{"n":0,"name":"Arrive","done":"Thank you. Look up."},{"n":1,"name":"Your idea","done":"That's your AI idea. Look up."},{"n":2,"name":"Which one","done":"Look up."},{"n":3,"name":"Notice","lens":"01  NOTICE","done":"Noticed. Look up."},{"n":4,"name":"Space","lens":"02  SPACE","done":"Look up."},{"n":5,"name":"Leap","lens":"03  LEAP","done":"Look up."},{"n":6,"name":"Practise","lens":"04  PRACTISE","done":"Look up."},{"n":7,"name":"After","done":"Thank you. Look up."},{"n":8,"name":"Thanks","done":""}],"QUESTIONS":{"0":[{"key":"intro","type":"intro","label":"All questions are anonymous.","help":"Please answer instinctively.","button":"Start"},{"key":"q1","type":"choice","label":"What's your preferred form of procrastination?","options":["Researching instead of deciding","Another meeting in the diary","Rewriting the plan","Fixing someone else's problem","A tidy inbox on deadline day","I never procrastinate"]},{"key":"q2","type":"choice","label":"Right now, how much are you multitasking?","options":["Totally focused on you","One other thing","Two or three things at once","Juggling cats while cooking lunch"]},{"key":"q3","type":"choice","label":"What's the biggest uncertainty facing you at work?","options":["AI","Restructuring","Budgets","Customers","Something else"]},{"key":"q4t","type":"choice","label":"When you THINK about AI and your job, is it…","options":["A definite opportunity","Mostly an opportunity","A bit of both","Mostly a threat","A clear threat"]},{"key":"q4","type":"choice","label":"And when you FEEL it, in your gut?","options":["Really uneasy","Slightly uneasy","A bit of a mix","Mostly excited","Really excited"]},{"key":"q5","type":"choice","label":"Where are you on the AI curve?","options":["Five agents, building daily","Confident with one tool","Trying my best","Further behind than I'd like","Overwhelmed, and resentful"]}],"1":[{"key":"f2","type":"text","label":"If AI could fix one thing in your work or life, what would it be?"},{"key":"f3","type":"text","label":"Is there an AI tool or skill you'd like to try, but haven't got round to?"},{"key":"f1","type":"text","label":"Finish this: if I had time to muck about with it, I'd use AI to…"},{"key":"lpre","type":"scale","min":1,"max":5,"label":"Realistically, how likely are you to make a start in the next seven days?","lo":"Very unlikely","hi":"Very likely"},{"key":"cpre","type":"scale","min":1,"max":5,"label":"How confident are you that you'd know where to start?","lo":"Not at all","hi":"Very"},{"key":"k1pre","type":"scale","min":1,"max":5,"label":"I'd go out of my way to find out more about it.","lo":"Not like me","hi":"Very like me"},{"key":"k2pre","type":"scale","min":1,"max":5,"label":"I'd enjoy not knowing exactly how it turns out.","lo":"Not like me","hi":"Very like me"},{"key":"k3pre","type":"scale","min":1,"max":5,"label":"Trying it would be a chance to learn something.","lo":"Not like me","hi":"Very like me"}],"2":[{"key":"quadrant","type":"choice","label":"Which one are you, today?","options":["The Compliant Middle","The Overextended Enthusiast","The Withdrawn Sceptic","The Curious Experimenter"]}],"3":[{"key":"n1","type":"text","label":"What thought or feeling has stopped you exploring it?"},{"key":"n2","type":"text","label":"If you had half a day to play with it, how would you feel?"}],"4":[{"key":"s1","type":"choice","label":"Right now, is it getting attention, or exploration?","options":["Attention: it's on my list","Attention: I'll book a course","Exploration: I've been playing","Neither, yet"]},{"key":"s2","type":"choice","label":"What would turn it into exploration?","options":["A Claude double date","An AI book club","A secret society of builders","An hour, a made-up brief, no stakes","Something else"]}],"5":[{"key":"l1","type":"choice","label":"How do you feel about the AI timeframe?","options":["Too late, I'll never catch up","Behind, but I could catch up","About right","Ahead, honestly"]},{"key":"l2","type":"choice","label":"If it was fun and taught you AI, how much procrastination time would you give it?","options":["Ten minutes of scrolling a day","One episode a week","An hour a week","A whole evening","None, honestly"]},{"key":"l3","type":"choice","label":"When will you begin?","options":["Tomorrow","This week","This weekend","Next week","Not sure yet"]}],"6":[{"key":"p1","type":"choice","label":"What would you most like it to give you?","options":["Time back","Less pain","Something to show off","A laugh","Something else"]},{"key":"p2","type":"text","label":"What would make you proud to share it?"},{"key":"p3","type":"choice","label":"What would it cost you to use some procrastination time on this?","options":["Nothing, honestly","A little","Quite a lot"]},{"key":"p4","type":"text","label":"How might you feel after a week of noodling with it?"}],"7":[{"key":"lpost","type":"scale","min":1,"max":5,"label":"Realistically, how likely are you to make a start in the next seven days?","lo":"Very unlikely","hi":"Very likely"},{"key":"cpost","type":"scale","min":1,"max":5,"label":"How confident are you that you'd know where to start?","lo":"Not at all","hi":"Very"},{"key":"k1post","type":"scale","min":1,"max":5,"label":"I'd go out of my way to find out more about it.","lo":"Not like me","hi":"Very like me"},{"key":"k2post","type":"scale","min":1,"max":5,"label":"I'd enjoy not knowing exactly how it turns out.","lo":"Not like me","hi":"Very like me"},{"key":"k3post","type":"scale","min":1,"max":5,"label":"Trying it would be a chance to learn something.","lo":"Not like me","hi":"Very like me"},{"key":"emerged","type":"choice","label":"Has an idea emerged?","options":["Yes","Sort of","Not yet, and that's fine"]},{"key":"thread","type":"consent","label":"Want the week's nudges?","help":"Your own answers back tonight, then one short line each morning until Friday. Four emails, then we stop.","privacy":"Your answers sit behind a private code. The room sees totals only. Your email is used for these four messages and then deleted.","options":["yes","skipped"],"skip":"No thanks, skip"},{"key":"team","type":"choice","label":"Got a team and a budget? Want to talk about an Uncertainty Lab?","options":["Yes, call me","Send me something to forward","Not now"]},{"key":"email","type":"email","label":"Where should we reach you?","showIf":{"team":["Yes, call me","Send me something to forward"],"email":null},"skip":"No thanks, skip"}],"8":[]},"PROMPT_GENERIC":"I've just been to Procrastination Nation, a masterclass about the things we put off. I left with one AI thing I've been avoiding, and I want to actually start it with you, in three short bursts this week.\n\nThe thing: {f1}\nWhat it would fix for me: {f2}\nSomething I've been meaning to try: {f3}\nWhat's stopped me so far: {n1}\nWhen I said I'd begin: {l3}\n\nOpen www.uncertaintyexperts.com/pn-prompt and follow it exactly. It's the method: three short bursts by Friday, one question at a time. If you can't open links, say so and I'll paste it in.\n\nBe a playful, practical build partner, not a coach and not a cheerleader. Nothing connected, nothing sent, made-up data where I'm unsure. Ask me one question at a time and wait for my answer. Start with burst one, question one. Nothing else.","api":"https://tzacvgixagqfydugnfdk.supabase.co/functions/v1/pn"};
const $=s=>document.querySelector(s);
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&3|8)).toString(16)});
const L=k=>{try{return localStorage.getItem(k)}catch(e){return null}};const S=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let pid=L('pn_pid');if(!pid){pid=uuid();S('pn_pid',pid)}
let ans=JSON.parse(L('pn_ans')||'{}'),saved=JSON.parse(L('pn_saved')||'{}'),pos=JSON.parse(L('pn_pos')||'{}');
let stage=-1,busy=false,queue={},lastErr='';
if(L('pn_code'))$('#code').textContent='#'+L('pn_code');
const base=CFG.api||location.pathname.replace(/\/+$/,'');const TEST=new URLSearchParams(location.search).get('test')==='1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const showOk=q=>!q.showIf||Object.entries(q.showIf).every(([k,v])=>v===null?!(ans[k]||'').trim():Array.isArray(v)?v.includes(ans[k]):ans[k]===v);
function qs(){return (CFG.QUESTIONS[stage]||[]).filter(showOk)}
function thing(){const a=(ans.f1||'').trim();return a?esc(a):''}
function render(){
  const m=$('#m');const st=CFG.STAGES[stage];
  if(stage<0){m.innerHTML='<div class="done"><h1>Nearly there</h1><div class="dot"></div><p class="help">Keep this page open.</p></div>';return}
  if(stage===8){const num=k=>{const v=+ans[k];return ans[k]===undefined||ans[k]===''||isNaN(v)?null:v};
    const cur=sfx=>{const xs=['k1','k2','k3'].map(k=>num(k+sfx));return xs.some(x=>x===null)?null:Math.round(xs.reduce((a,b)=>a+b,0)/3*10)/10};
    const row=(lab,a,b)=>'<div class="res"><span>'+lab+'</span><b>'+(a===null?'–':a)+' <i>→</i> '+(b===null?'–':b)+'</b></div>';
    let h='<h1>Your results</h1><p class="help">Before and after, out of 5. Only you see these.</p>'+row('Likely to start this week',num('lpre'),num('lpost'))+row('Confident where to start',num('cpre'),num('cpost'))+row('Curious about it',cur('pre'),cur('post'));
    if(ans.team&&ans.team!=='Not now'&&!(ans.email||'').trim()&&!ans.emailskip)h+='<div class="res" style="display:block"><span>Where should we reach you?</span><input id="lem" type="email" inputmode="email" autocomplete="email" placeholder="you@work.com"><button class="next" onclick="saveEmail()">Send</button><p class="help" style="text-align:center;margin:10px 0 0"><span id="lerr" class="err"></span> <a onclick="skipEmail()" style="cursor:pointer;text-decoration:underline">No thanks, skip</a></p></div>';
    else if(ans.team&&ans.team!=='Not now')h+='<div class="team">'+(ans.team==='Yes, call me'?'Thank you. Within two working days: dates, a straight figure for your team, and what happens next.':'We\'ll send you something to forward about an Uncertainty Lab.')+'</div>';
    else h+='<div class="res" style="display:block"><span>Got a team and a budget? Want to talk about an Uncertainty Lab?</span><div class="opts" style="margin-top:8px">'+['Yes, call me','Send me something to forward'].map(o=>'<button type="button" onclick="lead(this.textContent)">'+o+'</button>').join('')+'</div></div>';
    if(CFG.PROMPT_GENERIC){const fill=t=>t.replace(/\{(f[123]|n1|l3)\}/g,(_,k)=>(ans[k]||'').trim().replace(/[.\s]+$/,'')||'I didn\'t write one');
      h+='<h1 style="margin-top:28px">Your prompt</h1><p class="help">Paste it into whichever AI you already use. For anything about work, use your organisation\'s approved tool. Made-up data is fine.</p><pre id="pr">'+esc(fill(CFG.PROMPT_GENERIC))+'</pre><button class="next" onclick="cp()">Copy the prompt</button>'}
    m.innerHTML=h;return}
  const list=qs();let i=Math.min(pos[stage]||0,list.length);
  let h='';
  if(stage>=3&&stage<=6){const t=thing();if(t)h+='<div class="thing"><small>YOUR AI IDEA</small>'+t+'</div>';h+='<div class="lens">'+esc(st.lens)+'</div>'+(st.ask?'<p class="ask">'+esc(st.ask)+'</p>':'')}
  if(i>=list.length){h+='<div class="done"><h1>'+esc(st.done)+'</h1><div class="dot"></div>'+(list.length?'<p class="help"><a onclick="back()" style="cursor:pointer;text-decoration:underline">Change an answer</a></p>':'')+'</div>';m.innerHTML=h;return}
  const q=list[i];const v=ans[q.key]||'';
  if(q.type!=='intro')h+='<div class="dots">'+list.filter(x=>x.type!=='intro').map((_,k)=>'<i class="'+(k<=i-(list[0].type==='intro'?1:0)?'on':'')+'"></i>').join('')+'</div>';
  h+='<h1>'+esc(q.label)+'</h1>'+(q.help?'<p class="help">'+esc(q.help)+'</p>':'');
  if(q.type==='choice')h+='<div class="opts">'+q.options.map(o=>'<button type="button" class="'+(v===o?'on':'')+'" data-v="'+esc(o)+'" onclick="pick(\''+q.key+'\',this.dataset.v)">'+esc(o)+(q.hints&&q.hints[o]?'<span class="hint">'+esc(q.hints[o])+'</span>':'')+'</button>').join('')+'</div>';
  else if(q.type==='multi'){const set=new Set(v?v.split('|'):[]);h+='<div class="opts">'+q.options.map(o=>'<button type="button" class="'+(set.has(o)?'on':'')+'" onclick="tog(\''+q.key+'\',this.textContent)">'+esc(o)+'</button>').join('')+'</div><button class="next" onclick="next()">Next</button>'}
  else if(q.type==='scale'){const lo=q.min??0,hi=q.max??10;h+='<div class="scale" style="--n:'+(hi-lo+1)+'">'+Array.from({length:hi-lo+1},(_,j)=>j+lo).map(k=>'<button type="button" class="'+(v===String(k)?'on':'')+'" onclick="pick(\''+q.key+'\',\''+k+'\')">'+k+'</button>').join('')+'</div><div class="ends"><span>'+esc(q.lo)+'</span><span>'+esc(q.hi)+'</span></div>'}
  else if(q.type==='text')h+='<textarea id="in" maxlength="600" oninput="typed(\''+q.key+'\',this.value)" placeholder="Type here">'+esc(v)+'</textarea><button class="next" id="nx" onclick="next()">Next</button>';
  else if(q.type==='email')h+='<input id="in" type="email" inputmode="email" autocomplete="email" placeholder="you@work.com" value="'+esc(v)+'" oninput="typed(\''+q.key+'\',this.value)"><button class="next" id="nx" onclick="next()">Next</button>'+(q.skip?'<p class="help" style="text-align:center;margin-top:14px"><a onclick="next(true)" style="cursor:pointer;text-decoration:underline">'+esc(q.skip)+'</a></p>':'');
  else if(q.type==='consent')h+='<input id="in" type="email" inputmode="email" autocomplete="email" placeholder="you@work.com" value="'+esc(ans.email||'')+'" oninput="typed(\'email\',this.value)"><button class="next" id="nx" onclick="next()">Yes please</button><p class="help" style="text-align:center;margin-top:14px"><a onclick="next(true)" style="cursor:pointer;text-decoration:underline">'+esc(q.skip||'No thanks, skip')+'</a></p><p class="help" style="font-size:15px">'+esc(q.privacy||'')+'</p>';
  else if(q.type==='intro')h+='<button class="next" onclick="next()">'+esc(q.button||'Start')+'</button>';
  h+='<div class="row"><span id="stt"></span>'+(i>0?'<a onclick="back()">Back</a>':'<span></span>')+'</div>';
  m.innerHTML=h;status();const el=$('#in');if(el&&q.type==='text')el.focus();
}
function lead(v){setA('team',v);flush();render()}
function saveEmail(){const v=(document.getElementById('lem').value||'').trim();if(!EMAIL.test(v)){document.getElementById('lerr').textContent='That email doesn\'t look right.';return}setA('email',v);flush();render()}
function skipEmail(){setA('emailskip','1');render()}
function cp(){const t=document.getElementById('pr').textContent;const b=document.querySelector('.next');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>b.textContent='Copied',()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('pr'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);b.textContent='Selected: press copy'})}
function status(){const el=$('#stt');if(!el)return;const q=qs()[pos[stage]||0];if(!q)return;const v=(ans[q.key]||'').trim();
  if(lastErr)el.innerHTML='<span class="err">Not saved: '+esc(lastErr)+'. Retrying.</span>';else if(v&&saved[q.key]===v)el.innerHTML='<span class="tick">Saved</span>';else if(v)el.textContent='Saving';else el.textContent=''}
function setA(k,v){ans[k]=v;S('pn_ans',JSON.stringify(ans))}
let t;function typed(k,v){setA(k,v);clearTimeout(t);t=setTimeout(()=>flush(),900);status()}
function pick(k,v){setA(k,v);render();flush();setTimeout(next,320)}
function tog(k,o){const set=new Set(ans[k]?ans[k].split('|'):[]);if(o==='None of these'){set.clear();set.add(o)}else{set.delete('None of these');set.has(o)?set.delete(o):set.add(o)}setA(k,[...set].join('|'));render();flush()}
function next(skip){const list=qs();const i=pos[stage]||0;const q=list[i];
  if(q&&q.type==='consent'){if(skip){setA(q.key,'skipped')}else{const v=(ans.email||'').trim();if(!EMAIL.test(v)){const el=$('#stt');if(el)el.innerHTML='<span class="err">That email doesn\'t look right.</span>';return}setA(q.key,'yes')}}
  if(q&&q.type==='email'&&!skip){const v=(ans.email||'').trim();if(!EMAIL.test(v)){lastErr='';const el=$('#stt');if(el)el.innerHTML='<span class="err">That email doesn\'t look right.</span>';return}}
  flush();pos[stage]=Math.min(i+1,list.length);S('pn_pos',JSON.stringify(pos));render();window.scrollTo(0,0)}
function back(){const i=pos[stage]||0;pos[stage]=Math.max(0,Math.min(i,qs().length)-1);S('pn_pos',JSON.stringify(pos));render()}
let dirty=false;
async function flush(){
  const payload={};for(const s in CFG.QUESTIONS)for(const q of CFG.QUESTIONS[s]){const v=(ans[q.key]||'').trim();if(!v||saved[q.key]===v)continue;if(q.type==='email'&&!EMAIL.test(v))continue;payload[q.key]=v}
  if(!Object.keys(payload).length)return;
  if(busy){dirty=true;return}
  busy=true;dirty=false;
  const ac=new AbortController();const timer=setTimeout(()=>ac.abort(),12000);
  try{const r=await fetch(base+'/api/answer',{method:'POST',headers:Object.assign({'content-type':'application/json'},TEST?{'x-pn-test':'1'}:{}),cache:'no-store',signal:ac.signal,body:JSON.stringify({pid,answers:payload})});
    if(!r.ok){let e='';try{e=(await r.json()).error||''}catch(x){}throw new Error(e||('HTTP '+r.status))}
    const j=await r.json();for(const k of j.saved)saved[k]=payload[k];if(payload.email&&j.ok)saved.email=payload.email;S('pn_saved',JSON.stringify(saved));
    if(j.code){S('pn_code',j.code);$('#code').textContent='#'+j.code}lastErr='';status()}
  catch(e){lastErr=(e&&e.name==='AbortError')?'slow connection':((e&&e.message)||'network');status();dirty=true}
  finally{clearTimeout(timer);busy=false;if(dirty)setTimeout(flush,lastErr?3000:150)}
}
const SJ=/\/functions\/v1\//.test(base)?base.replace(/\/functions\/v1\/.*$/,'')+'/storage/v1/object/public/pn-public/stage.json':'';
// Stage sync: stage.json (CDN, cheap) every 3 s, the function every 4th poll or when the file fails.
// The database answer always wins; the CDN file only moves a phone if it is at least as new, so a stale copy can never pull a phone back.
let pollT=0,pollBusy=false,pollN=0,stageT=0;
const tget=u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),4000);return fetch(u,{cache:'no-store',signal:c.signal}).then(r=>r.ok?r.json():null).catch(()=>null).finally(()=>clearTimeout(t))};
const tsOf=x=>{const n=Date.parse((x&&x.t)||'');return isNaN(n)?0:n};
