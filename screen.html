<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PN screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8E6FF;--ink:#251F20;--lime:#D0FD51;--pink:#FF4DFF;--violet:#5639FF;--mute:rgba(37,31,32,.55)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:22px/1.3 Arial,Helvetica,sans-serif;overflow:hidden;cursor:none}
#wrap{position:absolute;left:21.7%;width:56.6%;top:0;bottom:11.8%;padding:40px 24px 20px;display:flex;flex-direction:column}
@media (max-aspect-ratio: 8/7){#wrap{left:0;width:100%}}
.kicker{font:28px/1 'Bebas Neue',Arial,sans-serif;letter-spacing:.08em;color:var(--violet);margin:0 0 6px}
h1{font:64px/1 'Bebas Neue',Arial,sans-serif;letter-spacing:.02em;margin:0 0 26px}
.big{font:220px/.9 'Bebas Neue',Arial,sans-serif;color:var(--violet);margin:10px 0 0}
.vs{font-size:26px;color:var(--mute);margin:8px 0 0}.vs b{color:var(--ink);font-weight:400}
.row{display:grid;grid-template-columns:1fr 2fr 110px;gap:16px;align-items:center;margin:14px 0;font-size:26px}
.row .b{height:38px;background:rgba(38,30,32,.1);border-radius:6px}.row .b i{display:block;height:100%;background:var(--violet);border-radius:6px;transition:width .6s}
.row.hot .b i{background:var(--pink)}.row.lime .b i{background:var(--lime)}.row .n{text-align:right;font:38px/1 'Bebas Neue',Arial,sans-serif}.row .n small{font:18px Arial;color:var(--mute);display:block}
.pp{display:flex;gap:60px;align-items:flex-end;height:420px;margin-top:20px;padding:0 60px}
.pp div{flex:1;text-align:center;font-size:26px;color:var(--mute)}.pp .col{border-radius:10px 10px 0 0;margin:0 auto 14px;width:72%;background:var(--violet);transition:height .6s}.pp .post{background:var(--lime)}
.pp b{display:block;font:110px/1 'Bebas Neue',Arial,sans-serif;color:var(--ink)}
.foot{margin-top:auto;font-size:20px;color:var(--mute)}
ul{list-style:none;margin:0;padding:0}li{font-size:30px;line-height:1.3;padding:16px 0;border-top:1px solid rgba(38,30,32,.15)}li:first-child{border-top:0}li::before{content:'“';color:var(--pink);font:60px/0 Georgia,serif;vertical-align:-18px;margin-right:6px}
#ix{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--mute)}
</style></head><body>
<div id="wrap"></div><div id="ix"></div>
<script>
const CFG={"key":null,"api":"https://tzacvgixagqfydugnfdk.supabase.co/functions/v1/pn"};let K=CFG.key||'';try{K=K||sessionStorage.getItem('pn_k')||''}catch(e){}if(!K)K=(prompt('Host key')||'').trim();const base=CFG.api||location.pathname.replace(/\/screen\/?$/,'');let R=null,i=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(v,t)=>t?Math.round(v/t*100):0;
function bars(obj,total,cls){obj=obj||{};const max=Math.max(1,...Object.values(obj));return Object.entries(obj).map(([k,v])=>'<div class="row '+((cls&&cls[k])||'')+'"><span>'+esc(k)+'</span><div class="b"><i style="width:'+(v/max*100)+'%"></i></div><span class="n">'+pct(v,total)+'%<small>'+v+'</small></span></div>').join('')}
function pp(sh,label){if(!sh||!sh.n)return '<p class="vs">Waiting for both answers.</p>';return '<div class="pp"><div><b>'+sh.pre+'</b><div class="col" style="height:'+(sh.pre/5*300)+'px"></div>Before</div><div><b>'+sh.post+'</b><div class="col post" style="height:'+(sh.post/5*300)+'px"></div>After</div></div><p class="foot">'+label+' · '+sh.n+' people answered both · '+sh.up+' went up, '+sh.same+' stayed, '+sh.down+' went down</p>'}
const S=[
 r=>'<p class="kicker">This room</p><h1>Preferred form of procrastination</h1>'+bars(r.choice.q1,r.answered.q1),
 r=>'<p class="kicker">This room</p><h1>How much are you multitasking?</h1>'+bars(r.choice.q2,r.answered.q2),
 r=>'<p class="kicker">This room</p><h1>Biggest uncertainty at work</h1>'+bars(r.choice.q3,r.answered.q3,{AI:'hot'}),
 r=>'<p class="kicker">This room</p><h1>AI and your job: think</h1>'+bars(r.choice.q4t,r.answered.q4t)+'<h1 style="margin-top:20px">And feel</h1>'+bars(r.choice.q4,r.answered.q4),
 r=>'<p class="kicker">This room</p><h1>Where are you on the AI curve?</h1>'+bars(r.choice.q5,r.answered.q5),
 r=>'<p class="kicker">This room</p><h1>Which one are you, today?</h1>'+bars(r.choice.quadrant,r.answered.quadrant,{'The Curious Experimenter':'hot'}),
 r=>'<p class="kicker">This room</p><h1>Attention, or exploration?</h1>'+bars(r.choice.s1,r.answered.s1),
 r=>'<p class="kicker">This room</p><h1>Procrastination time you would give it</h1>'+bars(r.choice.l2,r.answered.l2),
 r=>'<p class="kicker">This room</p><h1>When will you begin?</h1>'+bars(r.choice.l3,r.answered.l3),
 r=>'<p class="kicker">Before and after</p><h1>Likely to start this week</h1>'+pp(r.shift.likelihood,'1 to 5'),
 r=>'<p class="kicker">Before and after</p><h1>Confident you would know where to start</h1>'+pp(r.shift.confidence,'1 to 5'),
 r=>'<p class="kicker">Before and after</p><h1>Curiosity about it</h1>'+pp(r.shift.curiosity,'1 to 5'),
 r=>'<p class="kicker">This room</p><h1>What would it cost you?</h1>'+bars(r.choice.p3,r.answered.p3,{'Nothing, honestly':'hot'}),
 r=>'<p class="kicker">This room</p><h1>Has an idea emerged?</h1>'+bars(r.choice.emerged,r.answered.emerged,{Yes:'hot'}),
];
function draw(){if(!R)return;document.getElementById('wrap').innerHTML=S[i](R);document.getElementById('ix').textContent=(i+1)+'/'+S.length+' · '+R.n+' people'}
async function tick(){try{const r=await fetch(base+'/api/results',{headers:{'x-pn-key':K},cache:'no-store'});R=await r.json();draw()}catch(e){}setTimeout(tick,4000)}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));draw()}
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')go(1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1)});
addEventListener('click',()=>go(1));tick();
</script></body></html>
