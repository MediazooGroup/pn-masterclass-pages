<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PN host</title>
<style>
:root{--ink:#261E20;--violet:#5736F5;--lime:#C4FF02;--pink:#FF4DFF;--bg:#F6F2F7;--mute:#6b6470;--grey:#D9D3DC}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 Arial,Helvetica,sans-serif;color:var(--ink)}
.bar{background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:2}
.bar button{font:inherit;padding:9px 13px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:8px;cursor:pointer}
.bar button.on{background:var(--lime);border-color:var(--lime);color:var(--ink);font-weight:700}
.bar .sp{flex:1}.bar small{opacity:.8}.bar a{color:#fff}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--violet)}
.big{font-size:44px;font-weight:800;color:var(--ink);line-height:1}.big small{font-size:16px;color:var(--mute);font-weight:400}
.row{display:grid;grid-template-columns:170px 1fr 56px;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.row .b{height:18px;background:var(--grey);border-radius:4px}.row .b i{display:block;height:100%;background:var(--violet);border-radius:4px}
.row.hot .b i{background:var(--pink)}.row .n{text-align:right;font-variant-numeric:tabular-nums}
.pp{display:flex;gap:30px;align-items:flex-end;height:150px;margin:10px 0 0}
.pp div{flex:1;text-align:center;font-size:13px}.pp .col{background:var(--grey);border-radius:6px 6px 0 0;margin:0 auto;width:70%}.pp .col.post{background:var(--lime)}
.pp b{display:block;font-size:22px;color:var(--ink)}
ul.t{margin:0;padding:0;list-style:none;font-size:14px}ul.t li{padding:6px 0;border-bottom:1px solid #eee}ul.t li span{color:var(--mute);font-size:12px;margin-right:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools a,.tools button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;text-decoration:none;color:var(--ink);cursor:pointer}
.danger{border-color:#b00020!important;color:#b00020!important}
</style></head><body>
<div class="bar"><b>PN</b>&nbsp;<small>stage</small>
<button class="st" data-s="0" onclick="setStage(0)">0 Arrive</button><button class="st" data-s="1" onclick="setStage(1)">1 Framing</button><button class="st" data-s="2" onclick="setStage(2)">2 Notice</button><button class="st" data-s="3" onclick="setStage(3)">3 Space</button><button class="st" data-s="4" onclick="setStage(4)">4 Choose</button><button class="st" data-s="5" onclick="setStage(5)">5 Practise</button><button class="st" data-s="6" onclick="setStage(6)">6 After</button><button class="st" data-s="7" onclick="setStage(7)">7 Prompt</button>
<span class="sp"></span><small id="live">…</small>&nbsp;<a href="#" id="scr">Reveal screen</a></div>
<main id="m"></main>
<script>
const CFG={"STAGES":[{"n":0,"name":"Arrive","done":"Thanks. We'll begin shortly."},{"n":1,"name":"Framing","done":"That's your thing. Look up."},{"n":2,"name":"Notice","lens":"01  NOTICE","ask":"What's the uncertainty in front of you that's making you want to leave the room?","done":"Noticed. Look up."},{"n":3,"name":"Space","lens":"02  SPACE","ask":"Have you given this any space, or only more attention?","done":"Look up."},{"n":4,"name":"Choose","lens":"03  CHOOSE","ask":"How much of what you're waiting for is real information, and how much is so you don't have to feel uncertain?","done":"Chosen. Look up."},{"n":5,"name":"Practise","lens":"04  PRACTISE","ask":"What would you do if you weren't thinking about how it looked?","done":"That's your first move. Look up."},{"n":6,"name":"After","done":"Thank you. Look up."},{"n":7,"name":"Prompt","done":""}],"QUESTIONS":{"0":[{"key":"q1","type":"choice","label":"Your most common kind of procrastination?","options":["Researching it instead of doing it","Calling another meeting","Rewriting the plan","Helping someone else with theirs","Tidying the inbox","Honestly, nothing"]},{"key":"q2","type":"choice","label":"How many other things are you doing at the same time as this?","options":["None","One","Two","Three or more"]},{"key":"q3","type":"choice","label":"The biggest uncertainty facing you at work right now?","options":["AI","Restructuring or job security","Budget","Customers or the market","Leadership or strategy","Something else"]},{"key":"q4","type":"choice","label":"When it comes to using AI, I feel...","options":["Mostly excited","A bit excited","A bit uncertain","Very uncertain"]},{"key":"q5","type":"choice","label":"I know there are AI tools that could help me achieve more. If I'm honest, I'm procrastinating about them rather than exploring them.","options":["Yes, that's me","Partly","No, I'm on it"]}],"1":[{"key":"f1","type":"text","label":"What's the AI, or the kind of thing it does?","help":"You may not know its name. Rough is fine."},{"key":"f2","type":"text","label":"What would you like to explore with it?"},{"key":"f3","type":"text","label":"What would that exploration look like if it was fun?"},{"key":"cpre","type":"scale","label":"How confident are you that you'll make a start on it in the next 7 days?","lo":"Not at all","hi":"Certain"},{"key":"kpre","type":"scale","label":"How curious and playful do you feel about it right now?","lo":"Not at all","hi":"Very"}],"2":[{"key":"n1","type":"text","label":"Finish this: \"The bit I'm not sure about is...\""},{"key":"n2","type":"choice","label":"Which is closest?","options":["What if this exposes me","I don't know what to do with it","Nothing is moving"]},{"key":"sb","type":"multi","label":"What have you done instead, so far?","options":["Researched it","Called a meeting","Rewrote the plan","Helped someone else with theirs","Tidied the inbox","None of these"]}],"3":[{"key":"s1","type":"text","label":"What did you notice when you stopped staring at it?"},{"key":"s2","type":"text","label":"Where in the next week does it already have a bit of space?","help":"A commute, a walk, a Friday afternoon."}],"4":[{"key":"c1","type":"choice","label":"What are you actually waiting for?","options":["Mostly information","Mostly comfort","Honestly, both"]},{"key":"c2","type":"choice","label":"Pick one move","options":["A pause with a date","One piece of information I'll go and get","The smallest useful thing before tomorrow"]},{"key":"c3","type":"text","label":"Which, specifically?"}],"5":[{"key":"p1","type":"text","label":"What would you do if nobody could see the first attempt?"},{"key":"p2","type":"text","label":"My first move is..."},{"key":"p3","type":"choice","label":"...on","options":["Tomorrow","Thursday","Friday","Next Monday","Next Tuesday"]},{"key":"p4","type":"text","label":"If ___ gets in the way, I will ___","help":"Write both halves."}],"6":[{"key":"cpost","type":"scale","label":"How confident are you that you'll make a start on it in the next 7 days?","lo":"Not at all","hi":"Certain"},{"key":"kpost","type":"scale","label":"How curious and playful do you feel about it right now?","lo":"Not at all","hi":"Very"},{"key":"shift","type":"choice","label":"Did you feel a shift?","options":["Yes","A bit","No"]},{"key":"email","type":"email","label":"Your email, so tonight's reflection and your prompt come back to you.","help":"Only you see your answers. The room only ever sees totals."},{"key":"consent","type":"choice","label":"Can we email you on Thursday and the next two Tuesdays with a top-up prompt?","options":["Yes","No"]},{"key":"team","type":"choice","label":"I'd like to talk about running this with my team.","options":["Yes","No"]}],"7":[]},"key":null,"api":"https://tzacvgixagqfydugnfdk.supabase.co/functions/v1/pn"};const K=CFG.key||new URLSearchParams(location.search).get('k')||'';const base=CFG.api||location.pathname.replace(/\/host\/?$/,'');
const H={'content-type':'application/json','x-pn-key':K};
async function api(p,o){const r=await fetch(base+p,Object.assign({headers:H,cache:'no-store'},o));return r.json()}
async function setStage(s){await api('/api/stage',{method:'POST',body:JSON.stringify({stage:s})});tick()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bars(obj,total,hot){obj=obj||{};const max=Math.max(1,...Object.values(obj));return Object.entries(obj).map(([k,v])=>'<div class="row '+(hot&&hot.includes(k)?'hot':'')+'"><span>'+esc(k)+'</span><div class="b"><i style="width:'+(v/max*100)+'%"></i></div><span class="n">'+v+(total?' <small>'+Math.round(v/total*100)+'%</small>':'')+'</span></div>').join('')}
function pp(title,sh){if(!sh||!sh.n)return '<div class="card"><h3>'+title+'</h3><div class="big">–</div><small>needs both answers</small></div>';return '<div class="card"><h3>'+title+' <small>(n='+sh.n+', paired)</small></h3><div class="pp"><div><b>'+sh.pre+'</b><div class="col" style="height:'+(sh.pre*10)+'%"></div>Before</div><div><b>'+sh.post+'</b><div class="col post" style="height:'+(sh.post*10)+'%"></div>After</div></div><div style="margin-top:8px;font-size:13px;color:#6b6470">Up '+sh.up+' · Same '+sh.same+' · Down '+sh.down+' · Mean shift '+(sh.mean_shift>0?'+':'')+sh.mean_shift+'</div></div>'}
function texts(key,label,arr,hideable){return '<div class="card"><h3>'+label+' <small>('+(arr||[]).length+')</small></h3><ul class="t">'+(arr||[]).slice(0,40).map(t=>'<li style="'+(t.hidden?'opacity:.35;text-decoration:line-through':'')+'"><span>#'+t.code+'</span>'+esc(t.text)+(hideable?' <button style="font-size:11px;float:right" onclick="hide('+t.code+',\''+key+'\','+(!t.hidden)+')">'+(t.hidden?'show':'hide')+'</button>':'')+'</li>').join('')+'</ul></div>'}
async function hide(code,key,h){await api('/api/hide',{method:'POST',body:JSON.stringify({code,key,hidden:h})});tick()}
function render(r){
  document.querySelectorAll('.st').forEach(b=>b.classList.toggle('on',+b.dataset.s===r.stage));
  document.getElementById('live').textContent=r.n+' people · stage '+r.stage+' · '+new Date().toLocaleTimeString('en-GB');
  const c=r.choice,a=r.answered;let h='';
  h+='<div class="card"><h3>Q5 Procrastinating about AI tools</h3><div class="big">'+r.q5_yes+'%<small> yes or partly, of '+a.q5+' · paper: 62%</small></div>'+bars(c.q5,a.q5)+'</div>';
  h+='<div class="card"><h3>Q1 Most common procrastination</h3>'+bars(c.q1,a.q1)+'</div>';
  h+='<div class="card"><h3>Q2 Things at the same time</h3>'+bars(c.q2,a.q2)+'</div>';
  h+='<div class="card"><h3>Q3 Biggest uncertainty at work</h3>'+bars(c.q3,a.q3,['AI'])+'</div>';
  h+='<div class="card"><h3>Q4 Using AI, I feel</h3>'+bars(c.q4,a.q4)+'</div>';
  h+='<div class="card"><h3>Before: confidence and curiosity</h3><div class="row"><span>Confidence (0-10)</span><div class="b"><i style="width:'+((r.scale.cpre.mean||0)*10)+'%"></i></div><span class="n">'+(r.scale.cpre.mean??'–')+'</span></div><div class="row hot"><span>Curiosity (0-10)</span><div class="b"><i style="width:'+((r.scale.kpre.mean||0)*10)+'%"></i></div><span class="n">'+(r.scale.kpre.mean??'–')+'</span></div><small style="color:#6b6470">n='+r.scale.cpre.n+' / '+r.scale.kpre.n+' · things written: '+a.f1+'</small></div>';
  h+='<div class="card"><h3>Fear · Fog · Stasis</h3>'+bars(r.ffs,a.n2,['Fear'])+'</div>';
  h+='<div class="card"><h3>What they did instead</h3>'+bars(r.sb,a.sb)+'</div>';
  h+='<div class="card"><h3>The move they chose</h3>'+bars(c.c2,a.c2)+bars(c.p3,a.p3)+'</div>';
  h+=pp('Confidence to start this week',r.shift.confidence);
  h+=pp('Curiosity about it',r.shift.curiosity);
  h+='<div class="card"><h3>Did you feel a shift?</h3>'+bars(c.shift,a.shift,['Yes'])+'</div>';
  h+='<div class="card"><h3>Emails and consent</h3><div class="big">'+a.email+'<small> emails · '+(c.consent?c.consent.Yes:0)+' said yes to the Tuesdays</small></div></div>';
  h+='<div class="card"><h3>Wants to talk about their team <small>('+(r.team_emails||[]).length+')</small></h3>'+bars(c.team,a.team,['Yes'])+'<ul class="t">'+(r.team_emails||[]).map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul></div>';
  h+='<div class="card"><h3>Answers per question</h3><div style="font-size:13px;columns:3">'+Object.entries(a).map(([k,v])=>k+': '+v).join('<br>')+'</div></div>';
  h+=texts('p2','First moves (first three unhidden go on screen)',r.texts.p2,true)+texts('f3','If it was fun (up to six go on screen)',r.texts.f3,true)+texts('f1','Their thing',r.texts.thing)+texts('n1','The bit I\'m not sure about',r.texts.n1)+texts('p1','If nobody could see the first attempt',r.texts.p1);
  h+='<div class="card tools"><a href="'+base+'/api/export?k='+encodeURIComponent(K)+'">Export CSV (with emails, for the merge)</a><a href="'+base+'/api/export-anon?k='+encodeURIComponent(K)+'">Export CSV (codes only, for Claude)</a><button onclick="purge()">Delete all emails (after the merge)</button><button class="danger" onclick="reset()">Reset everything (rehearsal only)</button></div>';
  document.getElementById('m').innerHTML=h;
}
async function purge(){if(confirm('Delete every email address? Only do this after the merge has been sent.')){const r=await api('/api/purge-emails',{method:'POST'});alert('Purged '+r.purged)}}
async function reset(){const c=prompt('This deletes ALL responses. Type RESET to confirm.');if(c==='RESET'){await api('/api/reset',{method:'POST',body:JSON.stringify({confirm:c})});tick()}}
let timer;async function tick(){clearTimeout(timer);try{const r=await api('/api/results');if(r.error)throw new Error(r.error);render(r)}catch(e){document.getElementById('live').textContent='offline: '+e.message}timer=setTimeout(tick,4000)}
document.getElementById('scr').href=(CFG.api?'screen.html':base+'/screen')+'?k='+encodeURIComponent(K);tick();
</script></body></html>
