<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PN host</title>
<style>
:root{--ink:#251F20;--violet:#5639FF;--lime:#D0FD51;--pink:#FF4DFF;--bg:#E8E6FF;--mute:#6b6470;--grey:#D3D0E6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 Arial,Helvetica,sans-serif;color:var(--ink)}
.bar{background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:2}
.bar button{font:inherit;padding:9px 13px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:8px;cursor:pointer}
.bar button.on{background:var(--lime);border-color:var(--lime);color:var(--ink);font-weight:700}
.bar .sp{flex:1}.bar small{opacity:.8}.bar a{color:#fff}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--violet)}
.big{font-size:44px;font-weight:800;color:var(--ink);line-height:1}.big small{font-size:16px;color:var(--mute);font-weight:400}
.row{display:grid;grid-template-columns:170px 1fr 56px;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.row .b{height:18px;background:var(--grey);border-radius:4px}.row .b i{display:block;height:100%;background:var(--violet);border-radius:4px}
.row.hot .b i{background:var(--pink)}.row .n{text-align:right;font-variant-numeric:tabular-nums}
.pp{display:flex;gap:30px;align-items:flex-end;height:150px;margin:10px 0 0}
.pp div{flex:1;text-align:center;font-size:13px}.pp .col{background:var(--grey);border-radius:6px 6px 0 0;margin:0 auto;width:70%}.pp .col.post{background:var(--lime)}
.pp b{display:block;font-size:22px;color:var(--ink)}
ul.t{margin:0;padding:0;list-style:none;font-size:14px}ul.t li{padding:6px 0;border-bottom:1px solid #eee}ul.t li span{color:var(--mute);font-size:12px;margin-right:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools a,.tools button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;text-decoration:none;color:var(--ink);cursor:pointer}
.danger{border-color:#b00020!important;color:#b00020!important}
</style></head><body>
<div class="bar"><b>PN</b>&nbsp;<small>stage</small>
<button class="st" data-s="0" onclick="setStage(0)">0 Arrive</button><button class="st" data-s="1" onclick="setStage(1)">1 Your idea</button><button class="st" data-s="2" onclick="setStage(2)">2 Which one</button><button class="st" data-s="3" onclick="setStage(3)">3 Notice</button><button class="st" data-s="4" onclick="setStage(4)">4 Space</button><button class="st" data-s="5" onclick="setStage(5)">5 Leap</button><button class="st" data-s="6" onclick="setStage(6)">6 Practise</button><button class="st" data-s="7" onclick="setStage(7)">7 After</button><button class="st" data-s="8" onclick="setStage(8)">8 Thanks</button>
<span class="sp"></span><small id="live">…</small>&nbsp;<a href="#" id="scr">Reveal screen</a></div>
<main id="m"></main>
<script>
const CFG={"STAGES":[{"n":0,"name":"Arrive","done":"Thank you. Look up."},{"n":1,"name":"Your idea","done":"That's your AI idea. Look up."},{"n":2,"name":"Which one","done":"Look up."},{"n":3,"name":"Notice","lens":"01  NOTICE","done":"Noticed. Look up."},{"n":4,"name":"Space","lens":"02  SPACE","done":"Look up."},{"n":5,"name":"Leap","lens":"03  LEAP","done":"Look up."},{"n":6,"name":"Practise","lens":"04  PRACTISE","done":"Look up."},{"n":7,"name":"After","done":"Thank you. Look up."},{"n":8,"name":"Thanks","done":""}],"QUESTIONS":{"0":[{"key":"intro","type":"intro","label":"Your answers are private.","help":"Nobody in the session sees your name, only totals. Answer instinctively. You can stop at any time.","button":"Start"},{"key":"q1","type":"choice","label":"In the last few weeks, what's been your procrastination of choice?","options":["Researching instead of deciding","Another meeting in the diary","Rewriting the plan","Fixing someone else's problem","A tidy inbox on deadline day","I never procrastinate"]},{"key":"q2","type":"choice","label":"This minute, how much are you procrastinating?","options":["Totally focused on Sam and Katherine","One eye on my emails","Toggling the tabs, as usual","Scrolling cats while booking a holiday"]},{"key":"q3","type":"choice","label":"How much is AI on your organisation's mind right now?","options":["It's all anyone talks about","Pushed from the top, eye-rolls back","Some teams, not others","Resisting it, partly for the planet","Barely mentioned"]},{"key":"q4t","type":"choice","label":"Over the last few months, when you've thought about how AI is affecting your job, has it been…","options":["A definite opportunity","Mostly an opportunity","A bit of both","Mostly a threat","A clear threat"]},{"key":"q4","type":"choice","label":"And over the last few months, in your body or belly, how have you felt about AI and your career?","options":["Really uneasy","Slightly uneasy","A bit of a mix","Quietly excited","Really excited"]},{"key":"q5","type":"choice","label":"Over the last few months, where have you been on the AI curve?","options":["Five agents, building daily","Confident with one tool","Trying my best","Further behind than I'd like","Overwhelmed, and resentful"]}],"1":[{"key":"f1","type":"text","label":"If you woke up tomorrow confident and curious with AI, what's the first thing you'd use it for?","help":"One line. It stays at the top of your phone for the next part."},{"key":"lpre","type":"scale","min":1,"max":5,"label":"Realistically, how likely are you to start using AI properly in the next five days?","lo":"Very unlikely","hi":"Very likely"},{"key":"cpre","type":"scale","min":1,"max":5,"label":"How confident are you that you'd know where to start?","lo":"Not at all","hi":"Very"},{"key":"hpre","type":"scale","min":1,"max":5,"label":"If you brought AI into your life properly, how sure are you it would help?","lo":"Not at all","hi":"Very sure"},{"key":"k1pre","type":"scale","min":1,"max":5,"label":"I'd go out of my way to find out more about it.","lo":"Not like me","hi":"Very like me"},{"key":"k2pre","type":"scale","min":1,"max":5,"label":"I'd enjoy not knowing exactly how it turns out.","lo":"Not like me","hi":"Very like me"},{"key":"k3pre","type":"scale","min":1,"max":5,"label":"Trying it would be a chance to learn something.","lo":"Not like me","hi":"Very like me"}],"2":[{"key":"quadrant","type":"choice","label":"Which one are you, today?","options":["The Compliant Middle","The Overextended Enthusiast","The Withdrawn Sceptic","The Curious Experimenter"]}],"3":[{"key":"ns","type":"choice","label":"In the last few weeks, when you've thought about exploring AI beyond your comfort zone, what showed up first?","help":"The feeling or thought just before you put it off.","options":["Fear: a knot of anxiety","Fog: where would I even start?","Stasis: I'll do it when things calm down","Irritation: why should I have to?","A sudden urge to tidy my inbox"]},{"key":"nm","type":"text","label":"What might that signal be telling you?","help":"For example: \"It might do my job better than me.\" Or: \"I'll look stupid.\" One line."}],"4":[{"key":"s1","type":"choice","label":"Honestly, how much curious, experimental time with no brief have you spent with AI this month?","options":["Not a minute","Thought about it a lot (does that count?)","Read and watched, not played","Had a proper play"]},{"key":"s2","type":"choice","label":"What would turn your relationship with AI into a playful, curious love affair?","options":["A Claude double date","An AI book club","A secret society of builders","An hour, a made-up brief, no stakes","Something else"]}],"5":[{"key":"l1","type":"choice","label":"Where do you feel you are on your AI journey?","options":["Too late, I'll never catch up","Behind, but I could catch up","About right","Ahead, honestly"]},{"key":"l2","type":"choice","label":"If you knew it would give you the edge, how much of your procrastination time would you give to playing with AI?","options":["Ten minutes of my scrolling a day","An hour of my Netflix a week","A whole evening","None, honestly"]}],"6":[{"key":"p1","type":"choice","label":"If you gave some of your procrastination time to playing with AI for the next couple of weeks, how might you start to feel about it?","options":["Curious","More confident","Less behind","Like it's actually fun","Same as now"]},{"key":"p3","type":"choice","label":"What would it cost you to give some procrastination time to playing with AI over the next few weeks?","options":["Nothing, honestly","A little","Quite a lot"]},{"key":"p4","type":"text","label":"And honestly, what has not playing with AI cost you over the last six months?","help":"One line."}],"7":[{"key":"meta","type":"scale","min":1,"max":5,"label":"How much benefit have you got from an hour procrastinating about AI?","lo":"None at all","hi":"Loads"},{"key":"lpost","type":"scale","min":1,"max":5,"label":"Realistically, how likely are you to start using AI properly in the next five days?","lo":"Very unlikely","hi":"Very likely"},{"key":"cpost","type":"scale","min":1,"max":5,"label":"How confident are you that you'd know where to start?","lo":"Not at all","hi":"Very"},{"key":"hpost","type":"scale","min":1,"max":5,"label":"If you brought AI into your life properly, how sure are you it would help?","lo":"Not at all","hi":"Very sure"},{"key":"k1post","type":"scale","min":1,"max":5,"label":"I'd go out of my way to find out more about it.","lo":"Not like me","hi":"Very like me"},{"key":"k2post","type":"scale","min":1,"max":5,"label":"I'd enjoy not knowing exactly how it turns out.","lo":"Not like me","hi":"Very like me"},{"key":"k3post","type":"scale","min":1,"max":5,"label":"Trying it would be a chance to learn something.","lo":"Not like me","hi":"Very like me"},{"key":"q4tpost","type":"choice","label":"Over the next week, how do you want to think about AI and your job?","options":["A definite opportunity","Mostly an opportunity","A bit of both","Mostly a threat","A clear threat"]},{"key":"q4post","type":"choice","label":"And over the next week, how do you want to feel about it, in your body or belly?","options":["Really uneasy","Slightly uneasy","A bit of a mix","Quietly excited","Really excited"]},{"key":"q5post","type":"choice","label":"Over the next week, where do you want to be on the AI curve?","options":["Five agents, building daily","Confident with one tool","Trying my best","Further behind than I'd like","Overwhelmed, and resentful"]},{"key":"gloves","type":"intro","label":"Gloves off.","help":"This one's personal. Use whichever AI you're allowed to: your own is fine, and so is your organisation's approved tool. Your next answers become your prompt: three playful 15-minute bursts this week.","button":"Go"},{"key":"w1","type":"choice","label":"If AI really were a magic wand, who in your life would you love to surprise with something you'd made?","help":"Anyone counts, at home or at work.","options":["My partner","One of my kids","A friend","A parent","Someone at work","Me, honestly"]},{"key":"w2","type":"text","label":"What would genuinely delight them, or make their day a little easier?","help":"One line, just for your prompt. Nobody else sees it. Made-up is fine. Please don't name anyone."},{"key":"w3","type":"choice","label":"And if they loved it, how would you feel?","options":["Chuffed","Proud","A bit of a legend","Closer to them","Like I'd finally got AI"]},{"key":"l3","type":"choice","label":"When will you start your positive procrastination journey?","options":["Tonight","Tomorrow","This week","This weekend","Not sure yet"]},{"key":"thread","type":"consent","label":"Want the week's nudges?","help":"A prompt built from today's answers, tonight. Then one short line each morning until Friday. Four emails, then we stop.","privacy":"Your answers sit behind a private code. The session sees totals only. Your email is used for these four messages and then deleted.","options":["yes","skipped"],"skip":"No thanks, skip"},{"key":"team","type":"choice","label":"Got a team and a budget? Want to talk about an Uncertainty Lab?","options":["Yes, call me","Send me something to forward","Bring this hour to my team","Not now"]},{"key":"when","type":"choice","label":"When would you want it?","options":["This quarter","Next quarter","Just exploring"],"showIf":{"team":"Yes, call me"}},{"key":"email","type":"email","label":"Where should we reach you?","showIf":{"team":["Yes, call me","Send me something to forward","Bring this hour to my team"],"email":null},"skip":"No thanks, skip"}],"8":[]},"key":null,"api":"https://tzacvgixagqfydugnfdk.supabase.co/functions/v1/pn"};
// The key is read from ?k= once, kept in this tab's sessionStorage and removed from the address bar, so it never sits in history or a shared link.
let K=CFG.key||'';try{const q=new URLSearchParams(location.search);if(!K&&q.get('k')){K=q.get('k');sessionStorage.setItem('pn_k',K)}if(q.has('k')){q.delete('k');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''))}if(!K)K=sessionStorage.getItem('pn_k')||''}catch(e){}
if(!K&&!CFG.key){K=(prompt('Host key')||'').trim();try{sessionStorage.setItem('pn_k',K)}catch(e){}}const base=CFG.api||location.pathname.replace(/\/host\/?$/,'');
const H={'content-type':'application/json','x-pn-key':K};
async function api(p,o){const r=await fetch(base+p,Object.assign({headers:H,cache:'no-store'},o));return r.json()}
async function setStage(s){await api('/api/stage',{method:'POST',body:JSON.stringify({stage:s})});tick()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bars(obj,total,hot){obj=obj||{};const max=Math.max(1,...Object.values(obj));return Object.entries(obj).map(([k,v])=>'<div class="row '+(hot&&hot.includes(k)?'hot':'')+'"><span>'+esc(k)+'</span><div class="b"><i style="width:'+(v/max*100)+'%"></i></div><span class="n">'+v+(total?' <small>'+Math.round(v/total*100)+'%</small>':'')+'</span></div>').join('')}
function pp(title,sh){if(!sh||!sh.n)return '<div class="card"><h3>'+title+'</h3><div class="big">–</div><small>needs both answers</small></div>';return '<div class="card"><h3>'+title+' <small>(n='+sh.n+', paired)</small></h3><div class="pp"><div><b>'+sh.pre+'</b><div class="col" style="height:'+(sh.pre*20)+'%"></div>Before</div><div><b>'+sh.post+'</b><div class="col post" style="height:'+(sh.post*20)+'%"></div>After</div></div><div style="margin-top:8px;font-size:13px;color:#6b6470">Up '+sh.up+' · Same '+sh.same+' · Down '+sh.down+' · Mean shift '+(sh.mean_shift>0?'+':'')+sh.mean_shift+'</div></div>'}
function texts(key,label,arr,hideable){return '<div class="card"><h3>'+label+' <small>('+(arr||[]).length+')</small></h3><ul class="t">'+(arr||[]).slice(0,40).map(t=>'<li style="'+(t.hidden?'opacity:.35;text-decoration:line-through':'')+'"><span>#'+t.code+'</span>'+esc(t.text)+(hideable?' <button style="font-size:11px;float:right" onclick="hide('+t.code+',\''+key+'\','+(!t.hidden)+')">'+(t.hidden?'show':'hide')+'</button>':'')+'</li>').join('')+'</ul></div>'}
async function hide(code,key,h){await api('/api/hide',{method:'POST',body:JSON.stringify({code,key,hidden:h})});tick()}
function render(r){
  document.querySelectorAll('.st').forEach(b=>b.classList.toggle('on',+b.dataset.s===r.stage));
  document.getElementById('live').textContent=r.n+' people · stage '+r.stage+' · '+new Date().toLocaleTimeString('en-GB');
  const c=r.choice,a=r.answered;let h='';
  const card=(t,k,hot)=>'<div class="card"><h3>'+t+'</h3>'+bars(c[k],a[k],hot)+'</div>';
  h+=card('Q1 Preferred form of procrastination','q1',['I never procrastinate'])+card('Q2 Multitasking','q2')+card('Q3 Biggest uncertainty at work','q3',['AI']);
  h+='<div class="card"><h3>Q4 Think vs feel, AI and your job</h3><div class="row"><span><b>Think</b></span></div>'+bars(c.q4t,a.q4t)+'<div class="row"><span><b>Feel</b></span></div>'+bars(c.q4,a.q4)+'</div>';
  h+=card('Q5 Where are you on the AI curve?','q5');
  const sc=k=>(r.scale[k]&&r.scale[k].mean!=null)?r.scale[k].mean:'–';
  h+='<div class="card"><h3>Before (1 to 5)</h3><div style="font-size:15px;line-height:1.8">Likelihood '+sc('lpre')+' · Confidence '+sc('cpre')+' · Curiosity items '+sc('k1pre')+' / '+sc('k2pre')+' / '+sc('k3pre')+'<br><small style="color:#6b6470">ideas written: '+a.f1+'</small></div></div>';
  h+=card('Which one are you, today?','quadrant',['The Curious Experimenter']);
  h+=card('Space: attention or exploration','s1')+card('What would turn it into exploration','s2');
  h+=card('Leap: the AI timeframe','l1')+card('Procrastination time they would give it','l2')+card('When they will begin','l3');
  h+=card('Practise: what it would give them','p1')+card('What it would cost them','p3',['Nothing, honestly']);
  h+=pp('Likelihood of starting this week',r.shift.likelihood)+pp('Confidence they would know where to start',r.shift.confidence)+pp('Curiosity (three items)',r.shift.curiosity);
  h+=card('Has an idea emerged?','emerged',['Yes']);
  h+='<div class="card"><h3>Wants a call about the Lab <small>('+(r.team_emails||[]).length+')</small></h3>'+bars(c.team,a.team,['Yes, call me','Bring this hour to my team'])+'<ul class="t">'+(r.team_emails||[]).map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul></div>';
  h+='<div class="card"><h3>Answers per question</h3><div style="font-size:13px;columns:3">'+Object.entries(a).map(([k,v])=>k+': '+v).join('<br>')+'</div></div>';
  h+=texts('f1','Their AI idea (private, never on screen)',r.texts.f1)+texts('n1','What has stopped them',r.texts.n1)+texts('p2','Proud to share',r.texts.p2);
  h+='<div class="card tools"><button onclick="dl(\'/api/export\',\'pn_nudges_for_kit.csv\')">Export for Kit (nudges opt-ins)</button><button onclick="dl(\'/api/export-leads\',\'pn_leads_for_hubspot.csv\')">Export for HubSpot (leads)</button><button onclick="dl(\'/api/export-anon\',\'pn_export_anon.csv\')">Export answers (codes only, no emails)</button><button onclick="purge()">Delete all emails (after the merge)</button><button class="danger" onclick="reset()">Reset everything (rehearsal only)</button></div>';
  document.getElementById('m').innerHTML=h;
}
// Exports are fetched with the key in a header and saved as a file, so no link ever carries the key.
async function dl(path,name){const r=await fetch(base+path,{headers:H,cache:'no-store'});if(!r.ok){alert('Export failed: '+r.status);return}const u=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function purge(){if(confirm('Delete every email address? Only do this after the merge has been sent.')){const r=await api('/api/purge-emails',{method:'POST'});alert('Purged '+r.purged)}}
async function reset(){const c=prompt('This deletes ALL responses. Type RESET to confirm.');if(c==='RESET'){const r=await api('/api/reset',{method:'POST',body:JSON.stringify({confirm:c})});if(r.error)alert(r.error);tick()}}
// A rejected key (stale in this tab, or rotated) clears itself and asks again, so the page can never stick on an old key.
function askKey(msg){const k=(prompt(msg)||'').trim();if(!k)return false;K=k;H['x-pn-key']=k;try{sessionStorage.setItem('pn_k',k)}catch(e){}return true}
let timer,asked=false;async function tick(){clearTimeout(timer);try{const r=await api('/api/results');if(r.error==='not found'&&!CFG.key){try{sessionStorage.removeItem('pn_k')}catch(e){}if(!asked||confirm('The host key was not accepted. Enter it again?')){asked=true;if(askKey('Host key (the PN_HOST_KEY value)')){return tick()}}document.getElementById('live').innerHTML='Key not accepted. <a href="#" onclick="asked=false;tick();return false">Enter key</a>';timer=setTimeout(tick,15000);return}if(r.error)throw new Error(r.error);render(r)}catch(e){document.getElementById('live').textContent='offline: '+e.message}timer=setTimeout(tick,4000)}
// The reveal screen opens from here and inherits this tab's sessionStorage, so its address carries no key.
document.getElementById('scr').onclick=e=>{e.preventDefault();window.open(CFG.api?'screen.html':base+'/screen?k='+encodeURIComponent(K))};tick();
</script></body></html>
