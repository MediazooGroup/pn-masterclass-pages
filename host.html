<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PN host</title>
<style>
:root{--navy:#1F2A44;--orange:#F26B21;--bg:#F7F5F0;--mute:#6b7280;--grey:#BFC7D5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a}
.bar{background:var(--navy);color:#fff;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:2}
.bar button{font:inherit;padding:8px 12px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:8px;cursor:pointer}
.bar button.on{background:var(--orange);border-color:var(--orange);font-weight:700}
.bar .sp{flex:1}.bar small{opacity:.8}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.big{font-size:44px;font-weight:800;color:var(--navy);line-height:1}.big small{font-size:16px;color:var(--mute);font-weight:400}
.row{display:grid;grid-template-columns:150px 1fr 48px;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.row .b{height:18px;background:var(--grey);border-radius:4px;position:relative}.row .b i{display:block;height:100%;background:var(--navy);border-radius:4px}
.row.hot .b i{background:var(--orange)}.row .n{text-align:right;font-variant-numeric:tabular-nums}
.pp{display:flex;gap:30px;align-items:flex-end;height:150px;margin:10px 0 0}
.pp div{flex:1;text-align:center;font-size:13px}.pp .col{background:var(--grey);border-radius:6px 6px 0 0;margin:0 auto;width:70%}.pp .col.post{background:var(--orange)}
.pp b{display:block;font-size:22px;color:var(--navy)}
ul.t{margin:0;padding:0;list-style:none;font-size:14px}ul.t li{padding:6px 0;border-bottom:1px solid #eee}ul.t li span{color:var(--mute);font-size:12px;margin-right:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools a,.tools button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;text-decoration:none;color:#1a1a1a;cursor:pointer}
.danger{border-color:#b00020!important;color:#b00020!important}
body.screen main{grid-template-columns:repeat(2,1fr);padding:30px;gap:24px}
body.screen .card{padding:24px}body.screen .card h3{font-size:22px}body.screen .row{font-size:20px;grid-template-columns:260px 1fr 70px}body.screen .row .b{height:30px}
body.screen .big{font-size:84px}body.screen .pp{height:260px}body.screen .pp b{font-size:40px}body.screen .ctl,body.screen .tools,body.screen .texts,body.screen .meta{display:none}
body.screen .bar{opacity:.15}body.screen .bar:hover{opacity:1}
</style></head><body>
<div class="bar"><b>PN</b>&nbsp;<small>stage</small>
<button class="st" data-s="0" onclick="setStage(0)">0 Waiting</button><button class="st" data-s="1" onclick="setStage(1)">1 Start</button><button class="st" data-s="2" onclick="setStage(2)">2 The thing</button><button class="st" data-s="3" onclick="setStage(3)">3 Right now</button><button class="st" data-s="4" onclick="setStage(4)">4 Notice</button><button class="st" data-s="5" onclick="setStage(5)">5 Space</button><button class="st" data-s="6" onclick="setStage(6)">6 Choose</button><button class="st" data-s="7" onclick="setStage(7)">7 Practise</button><button class="st" data-s="8" onclick="setStage(8)">8 After</button><button class="st" data-s="9" onclick="setStage(9)">9 Your prompt</button>
<span class="sp"></span><small id="live">…</small>&nbsp;<a href="#" id="scr" style="color:#fff">Open reveal screen</a></div>
<main id="m"></main>
<script>
const CFG={"STAGES":[{"n":0,"name":"Waiting","title":"While you wait","sub":"Keep this page open beside the session. It moves on when Sam says so."},{"n":1,"name":"Start","title":"Before we start","sub":"Rough answers are the right answers."},{"n":2,"name":"The thing","title":"The thing","sub":"One rough line. You can change it later."},{"n":3,"name":"Right now","title":"Right now","sub":"Two numbers. Honestly."},{"n":4,"name":"Notice","title":"01  NOTICE","sub":"What's the uncertainty in front of you that's making you want to leave the room?"},{"n":5,"name":"Space","title":"02  SPACE","sub":"Have you given this any space, or only more attention?"},{"n":6,"name":"Choose","title":"03  CHOOSE","sub":"How much of what you're waiting for is real information, and how much is so you don't have to feel uncertain?"},{"n":7,"name":"Practise","title":"04  PRACTISE","sub":"What would you do if you weren't thinking about how it looked?"},{"n":8,"name":"After","title":"Same two questions","sub":"Honestly. Nobody is marking this."},{"n":9,"name":"Your prompt","title":"Your tool, to keep","sub":"The full version, with your answers in it, is in your inbox tonight."}],"QUESTIONS":{"0":[{"key":"ice","type":"choice","label":"What else are you doing right now?","options":["Solely focused on this","One eye on my emails","At least one social feed open","Totally distracted by something personal","Reliving an argument with someone"]},{"key":"ice5","type":"text","label":"Your favourite form of procrastination, in five words","help":"Optional. It may appear on screen, with no name."}],"1":[{"key":"email","type":"email","label":"Your email","help":"So tonight's reflection comes back to you. Only you see your answers. The room only ever sees totals."},{"key":"a1","type":"choice","label":"Is there something you'd like to do with AI and haven't got round to?","options":["Yes, one thing","Yes, several","No, I'm on it","No, I'm avoiding the whole thing"]},{"key":"a2","type":"choice","label":"The honest reason","options":["No time","It makes me nervous","Don't know where to start","Data rules at work","I keep meaning to","Other"]}],"2":[{"key":"a5","type":"text","label":"The thing, in one rough line. You can change it later.","help":"Stuck? \"An assistant that reads my inbox and tells me what matters.\" \"Try the AI thing my team keeps mentioning.\" \"Open Copilot for something that isn't a meeting summary.\""}],"3":[{"key":"a3","type":"scale","label":"Right now, how much of a threat does AI feel to you personally?","lo":"Not at all","hi":"A lot"},{"key":"a4","type":"scale","label":"Right now, how curious and playful do you feel about AI?","lo":"Not at all","hi":"Very"},{"key":"qd","type":"choice","label":"Which one are you, today?","options":["The Withdrawn Sceptic","The Overextended Enthusiast","The Compliant Middle","The Curious Experimenter"]}],"4":[{"key":"b1","type":"scale","label":"How confident are you that you'll actually make a start on it in the next 7 days?","lo":"Not at all","hi":"Certain"},{"key":"b2","type":"text","label":"The thing, in one sentence, as if telling a friend what you'd like to be able to do."},{"key":"sb","type":"multi","label":"What have you done instead? Tick all that apply.","options":["Researched it","Called a meeting","Rewrote the plan","Helped someone else with theirs","Tidied the inbox","None of these"]},{"key":"b3","type":"text","label":"Finish this: \"The bit I'm not sure about is...\""},{"key":"b4","type":"choice","label":"Which is closest?","options":["What if this exposes me","I don't know what to do with it","Nothing is moving"]}],"5":[{"key":"b5","type":"text","label":"What did you notice when you stopped staring at it?"},{"key":"b6","type":"text","label":"Where in the next week does it already have a bit of space?","help":"A commute, a walk, a Friday afternoon."}],"6":[{"key":"b7","type":"choice","label":"What are you actually waiting for?","options":["Mostly information","Mostly comfort","Honestly, both"]},{"key":"b8","type":"choice","label":"Pick one move","options":["A pause with a date","One piece of information I'll go and get","The smallest useful thing before tomorrow"]},{"key":"b9","type":"text","label":"Which, specifically?"}],"7":[{"key":"b10","type":"text","label":"What would you do if nobody could see the first attempt?"},{"key":"b11","type":"text","label":"My first move is..."},{"key":"b12","type":"choice","label":"...on","options":["Tomorrow","Thursday","Friday","Next Monday","Next Tuesday"]},{"key":"b13","type":"text","label":"If ___ gets in the way, I will ___","help":"Write both halves."}],"8":[{"key":"b14","type":"scale","label":"How confident are you that you'll actually make a start on it in the next 7 days?","lo":"Not at all","hi":"Certain"},{"key":"b15","type":"scale","label":"Right now, how curious and playful do you feel about AI?","lo":"Not at all","hi":"Very"},{"key":"b16","type":"choice","label":"Did you feel a shift?","options":["Yes","A bit","No"]},{"key":"b17","type":"choice","label":"Can we email you on the next four Tuesdays with your reflection and a top-up prompt?","options":["Yes","No"]},{"key":"b18","type":"choice","label":"I'd like to talk about running this with my team","options":["Yes","No"]}],"9":[]},"key":null,"api":"https://tzacvgixagqfydugnfdk.supabase.co/functions/v1/pn"};const K=CFG.key||new URLSearchParams(location.search).get('k')||'';const base=CFG.api||location.pathname.replace(/\/host\/?$/,'');
const H={'content-type':'application/json','x-pn-key':K};
async function api(p,o){const r=await fetch(base+p,Object.assign({headers:H,cache:'no-store'},o));return r.json()}
async function setStage(s){await api('/api/stage',{method:'POST',body:JSON.stringify({stage:s})});tick()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bars(obj,total,hot){const max=Math.max(1,...Object.values(obj));return Object.entries(obj).map(([k,v])=>'<div class="row '+(hot&&hot.includes(k)?'hot':'')+'"><span>'+esc(k)+'</span><div class="b"><i style="width:'+(v/max*100)+'%"></i></div><span class="n">'+v+(total?' <small>'+Math.round(v/total*100)+'%</small>':'')+'</span></div>').join('')}
function pp(title,sh){if(!sh||sh.n==null||!sh.n)return '<div class="card"><h3>'+title+'</h3><div class="big">–</div><small>needs both answers</small></div>';const mx=10;return '<div class="card"><h3>'+title+' <small>(n='+sh.n+', paired)</small></h3><div class="pp"><div><b>'+sh.pre+'</b><div class="col" style="height:'+(sh.pre/mx*100)+'%"></div>Before</div><div><b>'+sh.post+'</b><div class="col post" style="height:'+(sh.post/mx*100)+'%"></div>After</div></div><div style="margin-top:8px;font-size:13px;color:#6b7280">Up '+sh.up+' · Same '+sh.same+' · Down '+sh.down+' · Mean shift '+(sh.mean_shift>0?'+':'')+sh.mean_shift+'</div></div>'}
function texts(key,label,arr,hideable){return '<div class="card texts"><h3>'+label+' <small>('+(arr||[]).length+' shown)</small></h3><ul class="t">'+(arr||[]).slice(0,40).map(t=>'<li style="'+(t.hidden?'opacity:.35;text-decoration:line-through':'')+'"><span>#'+t.code+'</span>'+esc(t.text)+(hideable?' <button style="font-size:11px;float:right" onclick="hide('+t.code+',\''+key+'\','+(!t.hidden)+')">'+(t.hidden?'show':'hide')+'</button>':'')+'</li>').join('')+'</ul></div>'}
async function hide(code,key,h){await api('/api/hide',{method:'POST',body:JSON.stringify({code,key,hidden:h})});tick()}
function render(r){
  document.querySelectorAll('.st').forEach(b=>b.classList.toggle('on',+b.dataset.s===r.stage));
  document.getElementById('live').textContent=r.n+' phones · stage '+r.stage+' · '+new Date().toLocaleTimeString('en-GB');
  const a1=r.choice.a1,n1=r.answered.a1;const yes=(a1['Yes, one thing']||0)+(a1['Yes, several']||0);
  let h='';
  h+='<div class="card"><h3>Something put off with AI</h3><div class="big">'+(n1?Math.round(yes/n1*100):0)+'%<small> of '+n1+' · paper: 62%</small></div>'+bars(a1,n1)+'</div>';
  h+='<div class="card meta"><h3>The honest reason</h3>'+bars(r.choice.a2,r.answered.a2)+'</div>';
  h+='<div class="card"><h3>Threat and curiosity, before</h3><div class="row"><span>Threat (0-10)</span><div class="b"><i style="width:'+((r.scale.a3.mean||0)*10)+'%"></i></div><span class="n">'+(r.scale.a3.mean??'–')+'</span></div><div class="row hot"><span>Curiosity (0-10)</span><div class="b"><i style="width:'+((r.scale.a4.mean||0)*10)+'%"></i></div><span class="n">'+(r.scale.a4.mean??'–')+'</span></div><small style="color:#6b7280">n='+r.scale.a3.n+' / '+r.scale.a4.n+'</small></div>';
  h+='<div class="card"><h3>What they did instead</h3>'+bars(r.sb,r.answered.sb)+'</div>';
  h+='<div class="card"><h3>Fear · Fog · Stasis</h3>'+bars(r.ffs,r.answered.b4,['Fear','Fog','Stasis'])+'</div>';
  h+=pp('Confidence to start this week',r.shift.confidence);
  h+=pp('Curiosity about AI',r.shift.curiosity);
  h+='<div class="card"><h3>Did you feel a shift?</h3>'+bars(r.choice.b16,r.answered.b16,['Yes'])+'</div>';
  h+='<div class="card meta"><h3>The move they chose</h3>'+bars(r.choice.b8,r.answered.b8)+bars(r.choice.b12,r.answered.b12)+'</div>';
  h+='<div class="card meta"><h3>Answers per question</h3><div style="font-size:13px;columns:2">'+Object.entries(r.answered).map(([k,v])=>k+': '+v).join('<br>')+'</div></div>';
  h+='<div class="card"><h3>Icebreaker: doing instead</h3>'+bars(r.choice.ice,r.answered.ice)+'</div>';
  h+='<div class="card"><h3>Which one are you, today?</h3>'+bars(r.choice.qd,r.answered.qd,['The Curious Experimenter'])+'</div>';
  h+='<div class="card texts"><h3>Wants to talk about their team <small>('+(r.team_emails||[]).length+')</small></h3>'+bars(r.choice.b18,r.answered.b18,['Yes'])+'<ul class="t">'+(r.team_emails||[]).map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul></div>';
  h+=texts('ice5','Ticker: favourite procrastination (hide anything unsuitable)',r.texts.ice5,true)+texts('b11','First moves (first three unhidden go on screen)',r.texts.b11,true)+texts('a5','The thing (rough)',r.texts.a5)+texts('b3','The bit I\'m not sure about',r.texts.b3)+texts('b10','If nobody could see the first attempt',r.texts.b10);
  h+='<div class="card tools"><a href="'+base+'/api/export?k='+encodeURIComponent(K)+'">Export CSV (with emails, for the merge)</a><a href="'+base+'/api/export-anon?k='+encodeURIComponent(K)+'">Export CSV (codes only, for Claude)</a><button onclick="purge()">Delete all emails (after the merge)</button><button class="danger" onclick="reset()">Reset everything (rehearsal only)</button></div>';
  document.getElementById('m').innerHTML=h;
}
async function purge(){if(confirm('Delete every email address? Only do this after the merge has been sent.')){const r=await api('/api/purge-emails',{method:'POST'});alert('Purged '+r.purged)}}
async function reset(){const c=prompt('This deletes ALL responses. Type RESET to confirm.');if(c==='RESET'){await api('/api/reset',{method:'POST',body:JSON.stringify({confirm:c})});tick()}}
let timer;async function tick(){clearTimeout(timer);try{render(await api('/api/results'))}catch(e){document.getElementById('live').textContent='offline: '+e.message}timer=setTimeout(tick,4000)}
document.getElementById('scr').href=(CFG.api?'screen.html':base+'/screen')+'?k='+encodeURIComponent(K);tick();
</script></body></html>
